<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Sloth - Mini Exhibition of Feelings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c1021; touch-action: none; }

    /* จัดการเลเยอร์แคนวาสเกมให้อยู่ด้านหลัง */
    canvas { position: absolute; top: 0; left: 0; z-index: 1; outline: none; }

    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    
    .hud-box { 
      position: absolute; top: 15px; left: 15px; 
      background: rgba(20, 16, 38, 0.9); border: 1.5px solid #ff75a0; 
      padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 13px;
      box-shadow: 0 0 10px rgba(255, 117, 160, 0.3); pointer-events: auto;
    }
    .hud-title { color: #4ea8de; font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    
    .name-input {
      background: rgba(255, 255, 255, 0.15); border: 1px solid #4ea8de;
      color: #fff; padding: 4px 8px; border-radius: 4px; width: 140px;
      font-size: 12px; margin-top: 4px; outline: none; pointer-events: auto;
    }

    .btn-music {
      position: absolute; top: 15px; right: 15px;
      background: rgba(20, 16, 38, 0.9); border: 1.5px solid #ff75a0;
      color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
      cursor: pointer; pointer-events: auto; z-index: 20;
      box-shadow: 0 0 10px rgba(255, 117, 160, 0.3);
      display: flex; align-items: center; gap: 6px;
    }
    .btn-music.active { border-color: #4ea8de; box-shadow: 0 0 12px rgba(78, 168, 222, 0.5); }

    #chat-history {
      position: absolute; bottom: 75px; left: 50%;
      transform: translateX(-50%);
      width: 90%; max-width: 480px; height: 130px;
      background: rgba(15, 10, 25, 0.85);
      border: 1px solid rgba(78, 168, 222, 0.4);
      border-radius: 12px; padding: 10px 14px;
      overflow-y: auto; pointer-events: auto;
      display: flex; flex-direction: column; gap: 6px;
      font-size: 13px; color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
    #chat-history::-webkit-scrollbar { width: 5px; }
    #chat-history::-webkit-scrollbar-thumb { background: #4ea8de; border-radius: 10px; }
    
    .chat-msg { word-break: break-word; line-height: 1.4; animation: fadeIn 0.3s ease; }
    .chat-msg .author { color: #ff75a0; font-weight: bold; }
    .chat-msg .time { color: #7209b7; font-size: 10px; margin-left: 6px; opacity: 0.8; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    #chat-container {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      width: 90%; max-width: 480px;
      pointer-events: auto; z-index: 20;
    }

    .chat-input {
      flex: 1;
      background: rgba(15, 10, 25, 0.9);
      border: 1.5px solid #4ea8de;
      color: #fff; padding: 10px 16px; border-radius: 25px;
      font-size: 14px; outline: none; pointer-events: auto;
      box-shadow: 0 0 10px rgba(78, 168, 222, 0.3);
    }
    .chat-input::placeholder { color: #a0a0c0; }

    .btn-send {
      background: #4ea8de; border: none; color: #fff;
      padding: 10px 18px; border-radius: 20px; font-weight: bold;
      cursor: pointer; font-size: 13px; pointer-events: auto;
      box-shadow: 0 0 10px rgba(78, 168, 222, 0.4);
    }
    .btn-send:active { transform: scale(0.95); }

    .btn-mic {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(20, 16, 38, 0.9); border: 1.5px solid #ff75a0;
      color: #fff; font-size: 18px; display: flex;
      align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; pointer-events: auto;
      box-shadow: 0 0 10px rgba(255, 117, 160, 0.3);
    }
    .btn-mic.active {
      background: #ff75a0;
      animation: pulse-mic 1.2s infinite;
    }
    @keyframes pulse-mic { 0% { box-shadow: 0 0 0 0 rgba(255, 117, 160, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 117, 160, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 117, 160, 0); } }

    #joystick-base {
      position: absolute; bottom: 35px; left: 35px;
      width: 130px; height: 130px;
      background: rgba(78, 168, 222, 0.2);
      border: 3px solid rgba(255, 117, 160, 0.6);
      border-radius: 50%;
      pointer-events: auto; touch-action: none; cursor: pointer; z-index: 20;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 50px; height: 50px;
      background: rgba(255, 117, 160, 0.9);
      border: 2px solid #90e0ef;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(255, 117, 160, 0.6);
    }


    .elevator-prompt {
      position: absolute; bottom: 165px; left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 16, 38, 0.95);
      border: 2px solid #4cc9f0;
      color: #fff; padding: 12px 22px; border-radius: 30px;
      font-weight: bold; font-size: 15px;
      display: none; pointer-events: auto; cursor: pointer; z-index: 20;
      box-shadow: 0 0 20px rgba(76, 201, 240, 0.55);
      animation: pulse 1.5s infinite;
      white-space: nowrap;
    }

    .elevator-prompt.sky {
      border-color: #f72585;
      box-shadow: 0 0 20px rgba(247, 37, 133, 0.55);
    }

    .btn-jump { 
      position: absolute; bottom: 85px; right: 35px; width: 70px; height: 70px; 
      border-radius: 50%; background: rgba(78, 168, 222, 0.4); 
      border: 2px solid #4ea8de; color: #fff; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; z-index: 20;
      box-shadow: 0 0 15px rgba(78, 168, 222, 0.4);
    }
    .btn-jump:active { background: rgba(255, 117, 160, 0.8); }

    #checkin-prompt {
      position: absolute; bottom: 165px; right: 35px;
      background: #ff75a0; border: 2px solid #fff; color: #fff;
      padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 15px;
      display: none; pointer-events: auto; cursor: pointer; z-index: 20;
      box-shadow: 0 0 20px rgba(255, 117, 160, 0.8);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    #warp-notice {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 5, 25, 0.9); border: 2px solid #7209b7;
      color: #e0aaff; padding: 18px 36px; border-radius: 30px;
      font-size: 22px; font-weight: bold; text-align: center;
      pointer-events: none; opacity: 0; transition: opacity 0.4s ease; z-index: 30;
      box-shadow: 0 0 30px rgba(114, 9, 183, 0.8);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Audio Element: เพลงบรรเลงเปียโนและ Ambient เบาๆ ผ่อนคลาย ไม่ติดลิขสิทธิ์ -->
  <audio id="bgm-player" loop preload="metadata">
    <source src="./202608152209.mp3" type="audio/mpeg">
  </audio>

  <div id="ui-layer">
    <div class="hud-box">
      <div class="hud-title">🦥 28 CHECK-IN SIGNS</div>
      <div>ตั้งชื่อ: <input type="text" id="player-name-input" class="name-input" value="Sloth" placeholder="ไม่เกิน 7 ตัว"></div>
      <div style="margin-top:4px;">สถานะ: <span id="checkin-status" style="color:#ff85a1;">ยังไม่เช็คอิน</span></div>
      <div style="margin-top:2px; font-size:11px; color:#4ea8de;">โซน: <span id="zone-status">ห้องจัดแสดงหลัก</span></div>
    </div>

    <!-- ปุ่มเปิด-ปิดเพลง -->
    <button class="btn-music" id="btn-music">🔊 BGM: ปิดอยู่ (คลิกเปิดเพลง)</button>

    <div id="chat-history">
      <div class="chat-msg"><span class="author">ระบบ:</span> ยินดีต้อนรับสู่นิทรรศการ!</div>
    </div>

    <div id="chat-container">
      <button class="btn-mic" id="btn-mic" title="เปิด/ปิดไมค์">🎙️</button>
      <input type="text" id="chat-input" class="chat-input" placeholder="พิมพ์ข้อความคุยที่นี่...">
      <button class="btn-send" id="btn-send">ส่ง</button>
    </div>

    <div id="checkin-prompt">📝 กดเช็คอิน / แก้ไขป้าย</div>
    <div id="elevator-prompt">🛗 กดเพื่อขึ้นลิฟต์</div>
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div class="btn-jump" id="btn-jump">🦘</div>
    <div id="warp-notice">🔮 กำลังข้ามประตูมิติ...</div>
  </div>

  <script>
    // --- AUDIO CONTROL SYSTEM ---
    const bgmPlayer = document.getElementById('bgm-player');
    const btnMusic = document.getElementById('btn-music');
    let isMusicPlaying = false;

    // เพลงอยู่ไฟล์เดียวกับ index.html
    const MUSIC_FILE = './202608152209.mp3';

    bgmPlayer.volume = 0.65;
    bgmPlayer.preload = 'metadata';

    // ตั้ง source อีกครั้งด้วย URL ของหน้าเว็บ เพื่อให้ทำงานได้ดีบน GitHub Pages
    bgmPlayer.src = new URL(MUSIC_FILE, document.baseURI).href;
    bgmPlayer.load();

    bgmPlayer.addEventListener('loadedmetadata', () => {
      console.log('✅ โหลดไฟล์เพลงสำเร็จ:', bgmPlayer.currentSrc);
    });

    bgmPlayer.addEventListener('canplay', () => {
      console.log('✅ เพลงพร้อมเล่น');
    });

    bgmPlayer.addEventListener('error', () => {
      const error = bgmPlayer.error;
      console.error('❌ โหลดเพลงไม่สำเร็จ:', {
        code: error ? error.code : 'unknown',
        url: bgmPlayer.currentSrc
      });
      btnMusic.innerText = '❌ หาไฟล์เพลงไม่พบ';
    });

    function setMusicButton(playing) {
      isMusicPlaying = playing;

      if (playing) {
        btnMusic.innerText = '🎶 BGM: กำลังเล่นอยู่ 🔊';
        btnMusic.classList.add('active');
      } else {
        btnMusic.innerText = '🔊 BGM: ปิดอยู่ (คลิกเปิดเพลง)';
        btnMusic.classList.remove('active');
      }
    }

    async function toggleMusic() {
      try {
        if (bgmPlayer.paused) {
          await bgmPlayer.play();
          setMusicButton(true);
        } else {
          bgmPlayer.pause();
          setMusicButton(false);
        }
      } catch (err) {
        console.error('❌ เปิดเพลงไม่ได้:', err);
        setMusicButton(false);
        btnMusic.innerText = '⚠️ กดปุ่มอีกครั้งเพื่อเปิดเพลง';
      }
    }

    bgmPlayer.addEventListener('play', () => setMusicButton(true));
    bgmPlayer.addEventListener('pause', () => setMusicButton(false));
    bgmPlayer.addEventListener('ended', () => setMusicButton(false));

    // ต้องให้ผู้ใช้กด/แตะหน้าจอก่อน เพื่อหลีกเลี่ยง browser บล็อก autoplay
    btnMusic.addEventListener('click', toggleMusic);

    // ไม่สั่ง autoplay อัตโนมัติ
    // ผู้ใช้กดปุ่ม BGM เพื่อเริ่มเพลง

    // --- 1. SETUP THREE.JS SCENE ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1838);
    scene.fog = new THREE.FogExp2(0x1a1838, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xd8b4fe, 0.65);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x4ea8de, 0.9);
    dirLight.position.set(50, 80, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 2. MAIN ROOM (ขนาด 250x250) ---
    const ROOM_SIZE = 250;
    const BOUNDARY = (ROOM_SIZE / 2) - 3;

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE),
      new THREE.MeshStandardMaterial({ color: 0x8093f1, roughness: 0.6 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(ROOM_SIZE, 100, 0xff75a0, 0x48cae4);
    grid.position.y = 0.01;
    scene.add(grid);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xff85a1, roughness: 0.5 });
    function addWall(w, h, d, x, y, z) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      wall.position.set(x, y, z);
      wall.castShadow = wall.receiveShadow = true;
      scene.add(wall);
    }
    const WALL_H = 18;
    addWall(ROOM_SIZE, WALL_H, 3, 0, WALL_H/2, -ROOM_SIZE/2);
    addWall(ROOM_SIZE, WALL_H, 3, 0, WALL_H/2, ROOM_SIZE/2);
    addWall(3, WALL_H, ROOM_SIZE, -ROOM_SIZE/2, WALL_H/2, 0);
    addWall(3, WALL_H, ROOM_SIZE, ROOM_SIZE/2, WALL_H/2, 0);


    // --- 3. CENTRAL STAR VIEWING AREA (ลานดูดาวกลางแมพ) ---
    const STAR_AREA_X = 0;
    const STAR_AREA_Z = 0;
    const STAR_AREA_RADIUS = 32;

    const starAreaGroup = new THREE.Group();
    starAreaGroup.position.set(STAR_AREA_X, 0, STAR_AREA_Z);
    scene.add(starAreaGroup);

    // พื้นวงกลมสำหรับดูดาว
    const starDeck = new THREE.Mesh(
      new THREE.CylinderGeometry(STAR_AREA_RADIUS, STAR_AREA_RADIUS, 0.35, 96),
      new THREE.MeshStandardMaterial({
        color: 0x11162f,
        roughness: 0.28,
        metalness: 0.35
      })
    );
    starDeck.position.y = 0.18;
    starDeck.receiveShadow = true;
    starAreaGroup.add(starDeck);

    // วงแหวนเรืองแสงรอบลาน
    const starRing = new THREE.Mesh(
      new THREE.TorusGeometry(STAR_AREA_RADIUS - 2, 0.45, 16, 96),
      new THREE.MeshBasicMaterial({ color: 0x4cc9f0 })
    );
    starRing.rotation.x = Math.PI / 2;
    starRing.position.y = 0.45;
    starAreaGroup.add(starRing);

    const starRing2 = new THREE.Mesh(
      new THREE.TorusGeometry(STAR_AREA_RADIUS - 7, 0.12, 12, 96),
      new THREE.MeshBasicMaterial({ color: 0xf72585 })
    );
    starRing2.rotation.x = Math.PI / 2;
    starRing2.position.y = 0.48;
    starAreaGroup.add(starRing2);

    // จุดวงกลมเล็ก ๆ เป็นไฟนำทาง
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const light = new THREE.PointLight(i % 2 === 0 ? 0x4cc9f0 : 0xf72585, 0.55, 7);
      light.position.set(Math.cos(a) * (STAR_AREA_RADIUS - 3), 1.2, Math.sin(a) * (STAR_AREA_RADIUS - 3));
      starAreaGroup.add(light);
    }

    // ป้ายกลางลาน
    const starSignCanvas = document.createElement('canvas');
    starSignCanvas.width = 900;
    starSignCanvas.height = 240;
    const starSignCtx = starSignCanvas.getContext('2d');
    starSignCtx.fillStyle = 'rgba(10, 12, 35, 0.92)';
    starSignCtx.beginPath();
    starSignCtx.roundRect(20, 20, 860, 200, 40);
    starSignCtx.fill();
    starSignCtx.strokeStyle = '#4cc9f0';
    starSignCtx.lineWidth = 8;
    starSignCtx.stroke();
    starSignCtx.font = '900 64px "Segoe UI", sans-serif';
    starSignCtx.fillStyle = '#ffffff';
    starSignCtx.textAlign = 'center';
    starSignCtx.textBaseline = 'middle';
    starSignCtx.fillText('✦ STAR VIEWING AREA ✦', 450, 105);
    starSignCtx.font = 'bold 30px "Segoe UI", sans-serif';
    starSignCtx.fillStyle = '#90e0ef';
    starSignCtx.fillText('ลานดูดาวกลางนิทรรศการ', 450, 170);

    const starSignTexture = new THREE.CanvasTexture(starSignCanvas);
    const starSign = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 4.25),
      new THREE.MeshBasicMaterial({ map: starSignTexture, transparent: true })
    );
    starSign.position.set(0, 4.2, -25);
    starSign.rotation.y = Math.PI;
    starAreaGroup.add(starSign);

    // เก้าอี้/แท่นนั่งรอบลาน
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const seat = new THREE.Mesh(
        new THREE.BoxGeometry(5.5, 0.55, 2.0),
        new THREE.MeshStandardMaterial({ color: 0x252a4a, roughness: 0.5, metalness: 0.2 })
      );
      seat.position.set(Math.cos(a) * 21, 0.8, Math.sin(a) * 21);
      seat.rotation.y = -a;
      seat.castShadow = true;
      starAreaGroup.add(seat);
    }

    // กล้องโทรทรรศน์ 3 ตัว
    function addTelescope(x, z, rotationY) {
      const group = new THREE.Group();
      group.position.set(x, 0.6, z);
      group.rotation.y = rotationY;

      const tripod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.22, 3.2, 12),
        new THREE.MeshStandardMaterial({ color: 0x8d99ae, metalness: 0.7, roughness: 0.3 })
      );
      tripod.position.y = 1.6;
      group.add(tripod);

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.7, 0.7, 3.8, 24),
        new THREE.MeshStandardMaterial({ color: 0x4cc9f0, metalness: 0.55, roughness: 0.25 })
      );
      body.rotation.z = Math.PI / 2;
      body.position.set(0, 3.2, 0);
      group.add(body);

      const lens = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.48, 0.18, 24),
        new THREE.MeshBasicMaterial({ color: 0xf72585 })
      );
      lens.rotation.z = Math.PI / 2;
      lens.position.set(1.98, 3.2, 0);
      group.add(lens);

      const glow = new THREE.PointLight(0x4cc9f0, 0.5, 8);
      glow.position.set(0, 3.2, 0);
      group.add(glow);

      starAreaGroup.add(group);
    }

    addTelescope(-14, -8, 0.2);
    addTelescope(14, -8, -0.2);
    addTelescope(0, 15, Math.PI);

    // ดาวจำนวนมากบนท้องฟ้า
    const starPositions = [];
    const starColors = [];
    const STAR_COUNT = 900;

    for (let i = 0; i < STAR_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.48 + 0.08;
      const radius = 120 + Math.random() * 110;

      const x = Math.sin(phi) * Math.cos(theta) * radius;
      const y = Math.cos(phi) * radius + 25;
      const z = Math.sin(phi) * Math.sin(theta) * radius;

      starPositions.push(x, y, z);
      starColors.push(
        0.65 + Math.random() * 0.35,
        0.72 + Math.random() * 0.28,
        1.0
      );
    }

    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(starPositions, 3)
    );
    starGeometry.setAttribute(
      'color',
      new THREE.Float32BufferAttribute(starColors, 3)
    );

    const starMaterial = new THREE.PointsMaterial({
      size: 0.85,
      transparent: true,
      opacity: 0.9,
      vertexColors: true,
      sizeAttenuation: true
    });

    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    // ดาวตกเล็ก ๆ 3 ดวง
    const shootingStars = [];
    for (let i = 0; i < 3; i++) {
      const meteorGroup = new THREE.Group();
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      const tail = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.12, 5, 8),
        new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.55 })
      );
      tail.rotation.z = Math.PI / 3;
      tail.position.y = 2;
      meteorGroup.add(head);
      meteorGroup.add(tail);
      meteorGroup.position.set(
        -55 + i * 45,
        55 + i * 8,
        -45 - i * 12
      );
      scene.add(meteorGroup);
      shootingStars.push(meteorGroup);
    }

    // --- 3.5 ELEVATOR SYSTEM (ลิฟต์ขึ้นลานดูดาวชั้นบน) ---
    const ELEVATOR_X = 18;
    const ELEVATOR_Z = 0;
    const ELEVATOR_GROUND_Y = 0.05;
    const ELEVATOR_TOP_Y = 65;
    const ELEVATOR_SPEED = 0.32;
    const SKY_DECK_RADIUS = 32;

    const elevatorGroup = new THREE.Group();
    elevatorGroup.position.set(ELEVATOR_X, ELEVATOR_GROUND_Y, ELEVATOR_Z);
    scene.add(elevatorGroup);

    const elevatorPlatform = new THREE.Mesh(
      new THREE.CylinderGeometry(4.5, 4.5, 0.5, 48),
      new THREE.MeshStandardMaterial({

      for (let i = 0; i < chars.length; i++) {
        let testLine = currentLine + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          lines.push(currentLine);
          currentLine = chars[i];
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) lines.push(currentLine);
      return lines;

        index: index,
        group: group,
        canvas: canvas,
        ctx: ctx,
        texture: texture,
        ownerId: null,
        ownerName: "",
        message: "",
        position: new THREE.Vector3(config.x, 0, config.z)
      };

      signs.push(signData);
      renderSignText(signData);
    }

    function renderSignText(sign) {
      const ctx = sign.ctx;
      ctx.clearRect(0, 0, 1100, 700);

      ctx.fillStyle = sign.ownerId ? '#1a103c' : '#0b1329';
      ctx.fillRect(0, 0, 1100, 700);

      ctx.lineWidth = 16;
      ctx.strokeStyle = sign.ownerId ? '#ff75a0' : '#4ea8de';
      ctx.strokeRect(8, 8, 1084, 684);

      const signNumStr = `SIGN #${String(sign.index + 1).padStart(2, '0')}`;
      ctx.font = 'bold 36px "Segoe UI", Tahoma, sans-serif';
      ctx.fillStyle = '#ff75a0';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(signNumStr, 35, 30);

      if (sign.ownerId) {
        const badgeW = 420;
        const badgeH = 65;
        const badgeX = (1100 - badgeW) / 2;
        const badgeY = 25;

        ctx.fillStyle = 'rgba(15, 10, 30, 0.85)';
        ctx.beginPath();
        ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 30);
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ff75a0';
        ctx.stroke();

        ctx.font = 'bold 38px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sign.ownerName, 550, badgeY + (badgeH / 2));

        ctx.font = '40px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetical';

        const lines = getWrappedLines(ctx, sign.message, MAX_LINE_WIDTH);
        let startY = 175;
        const lineHeight = 58;

        lines.forEach((lineText, idx) => {
          ctx.fillText(lineText, 60, startY + (idx * lineHeight));
        });

      } else {
        ctx.font = 'bold 68px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = '#4ea8de';
        ctx.textAlign = 'center';
        ctx.fillText(`[ ป้ายว่าง #${sign.index + 1} ]`, 550, 310);
        
        ctx.font = '36px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = '#a0c4ff';
        ctx.fillText('เดินเข้ามาใกล้ๆ เพื่อเช็คอินที่นี่', 550, 410);
      }

      sign.texture.needsUpdate = true;
    }

    signPositions.forEach((pos, idx) => createSignBoard(pos, idx));

    // --- 8. CHAT & MIC SYSTEM ---
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    const btnMic = document.getElementById('btn-mic');
    const chatHistory = document.getElementById('chat-history');

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    function addMessageToHistory(author, message) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      msgDiv.innerHTML = `<span class="author">${escapeHTML(author)}:</span> ${escapeHTML(message)} <span class="time">${timeStr}</span>`;
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function sendChatMessage() {
      const msg = chatInput.value.trim();
      if (msg !== "") {
        addMessageToHistory(currentPlayerName || "Sloth", msg);

        currentChatMessage = msg.length > 24 ? msg.substring(0, 22) + "..." : msg;
        renderOverheadUI();

        if (chatMessageTimeout) clearTimeout(chatMessageTimeout);
        chatMessageTimeout = setTimeout(() => {
          currentChatMessage = "";
          renderOverheadUI();
        }, 5000);

        chatInput.value = "";
      }
    }

    btnSend.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });

    btnMic.addEventListener('click', () => {
      isMicActive = !isMicActive;
      btnMic.classList.toggle('active', isMicActive);
      renderOverheadUI();
    });

    // --- 9. INTERACTION LOGIC ---
    const checkinBtn = document.getElementById('checkin-prompt');
    const checkinStatusText = document.getElementById('checkin-status');
    const zoneStatusText = document.getElementById('zone-status');
    const warpNotice = document.getElementById('warp-notice');
    let nearbySign = null;

    checkinBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!nearbySign) return;

      if (nearbySign.ownerId !== null && nearbySign.ownerId !== "my_player_id") {
        alert(`❌ ป้ายนี้ถูกเช็คอินแล้วโดย "${nearbySign.ownerName}"`);
        return;
      }

      if (nearbySign.ownerId === null && playerCheckedInSignIndex !== null) {
        alert(`⚠️ คุณได้เช็คอินไว้ที่ "ป้าย #${playerCheckedInSignIndex + 1}" แล้ว`);
        return;
      }

      const currentMsg = nearbySign.message || "เขียนความรู้สึกของคุณลงบนป้ายนี้ได้เลย...";
      let userText = prompt(`พิมพ์ข้อความบนป้าย #${nearbySign.index + 1} (เขียนได้สูงสุด 7 บรรทัดเต็มป้าย):`, currentMsg);

      if (userText !== null && userText.trim() !== "") {
        const trimmedText = userText.trim();
        
        const tempCtx = nearbySign.ctx;
        tempCtx.font = '40px "Segoe UI", Tahoma, sans-serif';
        const calculatedLines = getWrappedLines(tempCtx, trimmedText, MAX_LINE_WIDTH);

        if (calculatedLines.length > MAX_BOARD_LINES) {
          alert(`❌ ไม่สามารถส่งได้! ข้อความของคุณยาวเกินขนาดป้าย\n(ข้อความยาว ${calculatedLines.length} บรรทัด แต่ป้ายรองรับได้สูงสุด 7 บรรทัด)\n\nกรุณาย่อข้อความแล้วลองส่งใหม่อีกครั้งครับ`);
          return;
        }

        nearbySign.ownerId = "my_player_id";
        nearbySign.ownerName = currentPlayerName || "ผู้เล่น";
        nearbySign.message = trimmedText;
        playerCheckedInSignIndex = nearbySign.index;

        renderSignText(nearbySign);
        checkinStatusText.innerText = `เช็คอินแล้วที่ ป้าย #${nearbySign.index + 1}`;
        checkinStatusText.style.color = "#4ea8de";
        alert("✅ ส่งข้อความและเช็คอินสำเร็จเรียบร้อย!");
      }
    });

    // --- 10. CONTROLS LOGIC ---
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    let joyInputX = 0, joyInputY = 0;
    let joystickActive = false;

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let deltaX = clientX - centerX;
      let deltaY = clientY - centerY;
      let dist = Math.hypot(deltaX, deltaY);
      const maxRadius = 40;

      if (dist > maxRadius) {
        deltaX = (deltaX / dist) * maxRadius;
        deltaY = (deltaY / dist) * maxRadius;
      }

      joystickKnob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
      joyInputX = deltaX / maxRadius;
      joyInputY = deltaY / maxRadius;
    }

    function resetJoystick() {
      joystickActive = false;
      joyInputX = 0; joyInputY = 0;
      joystickKnob.style.transform = `translate(-50%, -50%)`;
    }

    joystickBase.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      joystickActive = true;
      joystickBase.setPointerCapture(e.pointerId);
      handleJoystickMove(e.clientX, e.clientY);
    });
    joystickBase.addEventListener('pointermove', (e) => {
      if (joystickActive) handleJoystickMove(e.clientX, e.clientY);
    });
    joystickBase.addEventListener('pointerup', resetJoystick);
    joystickBase.addEventListener('pointercancel', resetJoystick);

    let velocityY = 0;
    const gravity = 0.018;
    const JUMP_FORCE = 0.48;
    let isGrounded = true;

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', e => {
      if (document.activeElement === nameInput || document.activeElement === chatInput) return;
      if (['KeyW', 'ArrowUp'].includes(e.code)) keys.w = true;
      if (['KeyS', 'ArrowDown'].includes(e.code)) keys.s = true;
      if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.a = true;
      if (['KeyD', 'ArrowRight'].includes(e.code)) keys.d = true;
      if (e.code === 'Space') jump();
    });
    window.addEventListener('keyup', e => {
      if (['KeyW', 'ArrowUp'].includes(e.code)) keys.w = false;
      if (['KeyS', 'ArrowDown'].includes(e.code)) keys.s = false;
      if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.a = false;
      if (['KeyD', 'ArrowRight'].includes(e.code)) keys.d = false;
    });

    let cameraYaw = 0, cameraPitch = 0.4;
    let isDraggingCam = false, prevCamX = 0, prevCamY = 0;

    window.addEventListener('pointerdown', e => {
      if (e.target.closest('#joystick-base') || e.target.closest('.btn-jump') || 
          e.target.closest('#checkin-prompt') || e.target.closest('.hud-box') || 
          e.target.closest('#chat-container') || e.target.closest('#chat-history') ||
          e.target.closest('#btn-music') || e.target.closest('.name-input')) return;
      isDraggingCam = true; prevCamX = e.clientX; prevCamY = e.clientY;
    });

    window.addEventListener('pointermove', e => {
      if (!isDraggingCam) return;
      cameraYaw -= (e.clientX - prevCamX) * 0.005;
      cameraPitch = Math.max(0.05, Math.min(1.2, cameraPitch + (e.clientY - prevCamY) * 0.005));
      prevCamX = e.clientX; prevCamY = e.clientY;
    });

    window.addEventListener('pointerup', () => isDraggingCam = false);

    const jumpBtn = document.getElementById('btn-jump');
    jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

    function jump() {
      if (isGrounded) { velocityY = JUMP_FORCE; isGrounded = false; }
    }


    // --- STAR LIFT CONTROL ---
    const elevatorPrompt = document.getElementById('elevator-prompt');
    let elevatorState = 'ground'; // ground, goingUp, sky, goingDown
    let elevatorY = ELEVATOR_GROUND_Y;
    let playerOnElevator = false;
    let lastElevatorPromptState = '';

    function isPlayerNearElevator() {
      const dx = slothGroup.position.x - ELEVATOR_X;
      const dz = slothGroup.position.z - ELEVATOR_Z;
      const horizontalDistance = Math.hypot(dx, dz);
      const verticalDistance = Math.abs(slothGroup.position.y - elevatorY);
      return horizontalDistance < 5.8 && verticalDistance < 5;
    }

    function setElevatorPrompt(text, isSky = false) {
      if (lastElevatorPromptState === text) return;
      lastElevatorPromptState = text;
      elevatorPrompt.innerText = text;
      elevatorPrompt.classList.toggle('sky', isSky);
    }

    function useElevator() {
      if (!isPlayerNearElevator()) return;
      if (elevatorState === 'ground') {
        elevatorState = 'goingUp';
        playerOnElevator = true;
        setElevatorPrompt('🛗 กำลังขึ้นลิฟต์...', false);
      } else if (elevatorState === 'sky') {
        elevatorState = 'goingDown';
        playerOnElevator = true;
        setElevatorPrompt('🛗 กำลังลงลิฟต์...', true);
      }
    }

    elevatorPrompt.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      useElevator();
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === nameInput || document.activeElement === chatInput) return;
      if (e.code === 'KeyE') useElevator();
    });

    // --- 11. GAME LOOP ---
    let timeAcc = 0;
    function update() {
      timeAcc += 0.03;

      centerTitleGroup.position.y = 18 + Math.sin(timeAcc) * 0.6;
      centerTitleGroup.rotation.y += 0.005;

      portals.forEach(p => {
        p.ringMesh.rotation.z += 0.03;
        p.ringMesh.rotation.x = Math.PI / 2 + Math.sin(timeAcc * 2) * 0.1;
      });

      starRing.rotation.z += 0.002;
      starRing2.rotation.z -= 0.003;
      starField.rotation.y += 0.00008;

      shootingStars.forEach((meteor, index) => {
        meteor.position.x += 0.18 + index * 0.04;
        meteor.position.y -= 0.06;
        meteor.position.z += 0.10;

        if (meteor.position.x > 80 || meteor.position.y < 25) {
          meteor.position.x = -80 - index * 25;
          meteor.position.y = 60 + index * 8;
          meteor.position.z = -50 - index * 10;
        }
      });

      let inputForward = 0, inputRight = 0;
      if (keys.w) inputForward += 1;
      if (keys.s) inputForward -= 1;
      if (keys.d) inputRight += 1;
      if (keys.a) inputRight -= 1;

      inputForward -= joyInputY;
      inputRight += joyInputX;

      const inputLen = Math.hypot(inputForward, inputRight);

      // ระหว่างขึ้น/ลงลิฟต์ ให้ผู้เล่นอยู่บนแท่นลิฟต์
      const elevatorMoving = elevatorState === 'goingUp' || elevatorState === 'goingDown';

      if (!elevatorMoving && !playerOnElevator && inputLen > 0.05) {
        const normF = inputForward / Math.max(1, inputLen);
        const normR = inputRight / Math.max(1, inputLen);
        const speed = 0.38 * Math.min(1, inputLen);

        const moveX = (normF * -Math.sin(cameraYaw)) + (normR * Math.cos(cameraYaw));
        const moveZ = (normF * -Math.cos(cameraYaw)) + (normR * -Math.sin(cameraYaw));

        slothGroup.position.x += moveX * speed;
        slothGroup.position.z += moveZ * speed;
        slothGroup.rotation.y = Math.atan2(moveX, moveZ);
      }

      if (elevatorState === 'goingUp') {
        elevatorY = Math.min(ELEVATOR_TOP_Y, elevatorY + ELEVATOR_SPEED);
        if (elevatorY >= ELEVATOR_TOP_Y) {
          elevatorY = ELEVATOR_TOP_Y;
          elevatorState = 'sky';
          playerOnElevator = true;
          zoneStatusText.innerText = 'ลานดูดาวสูง 65 เมตร';
          elevatorPrompt.style.display = 'flex';
          zoneStatusText.style.color = '#f72585';
          warpNotice.innerText = '🌌 ถึงลานดูดาวชั้นบนแล้ว';
          warpNotice.style.opacity = '1';
          setTimeout(() => warpNotice.style.opacity = '0', 1200);
        }
      } else if (elevatorState === 'goingDown') {
        elevatorY = Math.max(ELEVATOR_GROUND_Y, elevatorY - ELEVATOR_SPEED);
        if (elevatorY <= ELEVATOR_GROUND_Y) {
          elevatorY = ELEVATOR_GROUND_Y;
          elevatorState = 'ground';
          playerOnElevator = true;
          zoneStatusText.innerText = 'ห้องจัดแสดงหลัก';
          zoneStatusText.style.color = '#4ea8de';
          warpNotice.innerText = '🏠 กลับสู่ชั้นหลักแล้ว';
          warpNotice.style.opacity = '1';
          setTimeout(() => warpNotice.style.opacity = '0', 1200);
        }
      }

      elevatorGroup.position.y = elevatorY;
      elevatorGlowRing.rotation.z += 0.025;

      const onSkyLevel = elevatorY > 5 && (slothGroup.position.y > 5);

      if (playerOnElevator) {
        if (elevatorMoving) {
          slothGroup.position.x = ELEVATOR_X;
          slothGroup.position.z = ELEVATOR_Z;
          slothGroup.position.y = elevatorY;
          velocityY = 0;
          isGrounded = true;
        } else if (inputLen > 0.05) {
          // ออกจากลิฟต์ได้เมื่อถึงชั้นแล้ว
          playerOnElevator = false;
          const stepX = Math.cos(cameraYaw) * 2.0;
          const stepZ = -Math.sin(cameraYaw) * 2.0;
          slothGroup.position.x += stepX;
          slothGroup.position.z += stepZ;
          slothGroup.position.y = elevatorY;
        } else {
          slothGroup.position.x = ELEVATOR_X;
          slothGroup.position.z = ELEVATOR_Z;
          slothGroup.position.y = elevatorY;
          velocityY = 0;
          isGrounded = true;
        }
      } else {
        slothGroup.position.y += velocityY;
        if (!isGrounded) velocityY -= gravity;

        const floorY = (elevatorState === 'sky' && !playerOnElevator)
          ? ELEVATOR_TOP_Y
          : 0;

        if (slothGroup.position.y <= floorY) {
          slothGroup.position.y = floorY;
          velocityY = 0;
          isGrounded = true;
        }
      }

      if (onSkyLevel) {
        // ขอบเขตชั้นบนจัดการด้านล่าง
      } else if (inSmallRoom) {
        const minX = SMALL_ROOM_OFFSET_X - SMALL_BOUNDARY;
        const maxX = SMALL_ROOM_OFFSET_X + SMALL_BOUNDARY;
        slothGroup.position.x = Math.max(minX, Math.min(maxX, slothGroup.position.x));
        slothGroup.position.z = Math.max(-SMALL_BOUNDARY, Math.min(SMALL_BOUNDARY, slothGroup.position.z));
      } else {
        slothGroup.position.x = Math.max(-BOUNDARY, Math.min(BOUNDARY, slothGroup.position.x));
        slothGroup.position.z = Math.max(-BOUNDARY, Math.min(BOUNDARY, slothGroup.position.z));
      }

      // ลิฟต์และชั้นบนอยู่นอกข้อจำกัดความสูงของห้องหลัก
      if (onSkyLevel && !playerOnElevator) {
        const skyMinX = -SKY_DECK_RADIUS + 2;
        const skyMaxX = SKY_DECK_RADIUS - 2;
        const skyMinZ = -SKY_DECK_RADIUS + 2;
        const skyMaxZ = SKY_DECK_RADIUS - 2;
        slothGroup.position.x = Math.max(skyMinX, Math.min(skyMaxX, slothGroup.position.x));
        slothGroup.position.z = Math.max(skyMinZ, Math.min(skyMaxZ, slothGroup.position.z));
      }

      let nearAnyPortal = false;
      if (!onSkyLevel) for (let portal of portals) {
        const dist = slothGroup.position.distanceTo(portal.pos);
        if (dist < 4.5) {
          nearAnyPortal = true;
          if (!isWarping && exitedPortalYet) {
            isWarping = true;
            exitedPortalYet = false;
            warpNotice.innerText = `🔮 กำลังวาร์ปไปยัง: ${portal.label}`;
            warpNotice.style.opacity = '1';

            setTimeout(() => {
              slothGroup.position.copy(portal.targetPos);
              inSmallRoom = (portal.targetPos.x > 300);
              zoneStatusText.innerText = inSmallRoom ? "ห้องลับ (Secret Room)" : "ห้องจัดแสดงหลัก";
              zoneStatusText.style.color = inSmallRoom ? "#f72585" : "#4ea8de";
            }, 300);

            setTimeout(() => {
              warpNotice.style.opacity = '0';
              isWarping = false;
            }, 1200);
          }
          break;
        }
      }

      if (!nearAnyPortal) {
        let farFromAll = true;
        for (let portal of portals) {
          if (slothGroup.position.distanceTo(portal.pos) < 6) {
            farFromAll = false;
            break;
          }
        }
        if (farFromAll) {
          exitedPortalYet = true;
        }
      }

      nearbySign = null;
      for (let sign of signs) {
        const dist = slothGroup.position.distanceTo(sign.position);
        if (dist < 20) {
          nearbySign = sign;
          break;
        }
      }

      if (nearbySign) {
        checkinBtn.style.display = 'flex';
        if (nearbySign.ownerId === "my_player_id") {
          checkinBtn.innerText = `✏️ แก้ไขป้ายเช็คอิน #${nearbySign.index + 1}`;
        } else if (nearbySign.ownerId !== null) {
          checkinBtn.innerText = `🔒 ป้าย #${nearbySign.index + 1} (มีเจ้าของแล้ว)`;
        } else {
          checkinBtn.innerText = `📝 เช็คอินป้าย #${nearbySign.index + 1}`;
        }
      } else {
        checkinBtn.style.display = 'none';
      }

      // แสดงปุ่มใช้งานลิฟต์เมื่ออยู่ใกล้
      const nearElevator = isPlayerNearElevator();
      if (nearElevator && !elevatorMoving) {
        elevatorPrompt.style.display = 'flex';
        if (elevatorState === 'ground') {
          setElevatorPrompt('🛗 ขึ้นลิฟต์ไปลานดูดาว  •  E', false);
        } else {
          setElevatorPrompt('🛗 ลงลิฟต์กลับด้านล่าง  •  E', true);
        }
      } else if (!elevatorMoving) {
        elevatorPrompt.style.display = 'none';
        lastElevatorPromptState = '';
      }

      // ปรับกล้องให้มองเห็นลานดูดาวชั้นบน
      const camDist = 16;
      let targetCamX = slothGroup.position.x + camDist * Math.sin(cameraYaw) * Math.cos(cameraPitch);
      let targetCamY = slothGroup.position.y + camDist * Math.sin(cameraPitch) + 2;
      let targetCamZ = slothGroup.position.z + camDist * Math.cos(cameraYaw) * Math.cos(cameraPitch);

      if (onSkyLevel) {
        const pad = 3;
        targetCamX = Math.max(-SKY_DECK_RADIUS + pad, Math.min(SKY_DECK_RADIUS - pad, targetCamX));
        targetCamZ = Math.max(-SKY_DECK_RADIUS + pad, Math.min(SKY_DECK_RADIUS - pad, targetCamZ));
        targetCamY = Math.max(2, Math.min(ELEVATOR_TOP_Y + 25, targetCamY));
      } else if (inSmallRoom) {
        const pad = 2.5;
        const sMinX = SMALL_ROOM_OFFSET_X - SMALL_BOUNDARY + pad;
        const sMaxX = SMALL_ROOM_OFFSET_X + SMALL_BOUNDARY - pad;
        const sMinZ = -SMALL_BOUNDARY + pad;
        const sMaxZ = SMALL_BOUNDARY - pad;
        targetCamX = Math.max(sMinX, Math.min(sMaxX, targetCamX));
        targetCamZ = Math.max(sMinZ, Math.min(sMaxZ, targetCamZ));
        targetCamY = Math.max(1.2, Math.min(WALL_H - 1, targetCamY));
      } else {
        const pad = 3;
        targetCamX = Math.max(-BOUNDARY + pad, Math.min(BOUNDARY - pad, targetCamX));
        targetCamZ = Math.max(-BOUNDARY + pad, Math.min(BOUNDARY - pad, targetCamZ));
        targetCamY = Math.max(1.2, Math.min(WALL_H - 1, targetCamY));
      }

      camera.position.set(targetCamX, targetCamY, targetCamZ);
      camera.lookAt(slothGroup.position.x, slothGroup.position.y + 1.6, slothGroup.position.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
