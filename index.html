<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Bunny - Mini Exhibition of Feelings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c1021; touch-action: none; }

    canvas { position: absolute; top: 0; left: 0; z-index: 1; outline: none; }

    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    
    /* HUD ซ้ายบน ขนาดจิ๋ว */
    .hud-box { 
      position: absolute; top: 6px; left: 6px; 
      background: rgba(20, 16, 38, 0.85); border: 1px solid #ff75a0; 
      padding: 4px 8px; border-radius: 6px; color: #fff; font-size: 9px;
      box-shadow: 0 0 6px rgba(255, 117, 160, 0.3); pointer-events: auto;
      max-width: 135px;
    }
    .hud-title { color: #4ea8de; font-weight: bold; font-size: 9.5px; margin-bottom: 1px; }
    
    .name-input {
      background: rgba(255, 255, 255, 0.15); border: 1px solid #4ea8de;
      color: #fff; padding: 1px 4px; border-radius: 3px; width: 80px;
      font-size: 9px; margin-top: 1px; outline: none; pointer-events: auto;
    }

    .btn-music {
      position: absolute; top: 6px; right: 6px;
      background: rgba(20, 16, 38, 0.85); border: 1px solid #ff75a0;
      color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 9px; font-weight: bold;
      cursor: pointer; pointer-events: auto; z-index: 20;
      box-shadow: 0 0 6px rgba(255, 117, 160, 0.3);
      display: flex; align-items: center; gap: 3px;
    }
    .btn-music.active { border-color: #4ea8de; box-shadow: 0 0 8px rgba(78, 168, 222, 0.5); }

    /* ประวัติแชทขนาดบางและเล็กมาก */
    #chat-history {
      position: absolute; bottom: 42px; left: 50%;
      transform: translateX(-50%);
      width: 70%; max-width: 300px; height: 35px;
      background: rgba(15, 10, 25, 0.8);
      border: 1px solid rgba(78, 168, 222, 0.3);
      border-radius: 6px; padding: 2px 6px;
      overflow-y: auto; pointer-events: auto;
      display: flex; flex-direction: column; gap: 2px;
      font-size: 9px; color: #fff;
      backdrop-filter: blur(3px);
    }
    #chat-history::-webkit-scrollbar { width: 3px; }
    #chat-history::-webkit-scrollbar-thumb { background: #4ea8de; border-radius: 10px; }
    
    .chat-msg { word-break: break-word; line-height: 1.2; }
    .chat-msg .author { color: #ff75a0; font-weight: bold; }
    .chat-msg .time { color: #7209b7; font-size: 8px; margin-left: 3px; opacity: 0.8; }

    #chat-container {
      position: absolute; bottom: 6px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px;
      width: 70%; max-width: 300px;
      pointer-events: auto; z-index: 20;
    }

    .chat-input {
      flex: 1;
      background: rgba(15, 10, 25, 0.9);
      border: 1px solid #4ea8de;
      color: #fff; padding: 3px 8px; border-radius: 14px;
      font-size: 9.5px; outline: none; height: 26px; pointer-events: auto;
    }
    .chat-input::placeholder { color: #a0a0c0; }

    .btn-send {
      background: #4ea8de; border: none; color: #fff;
      padding: 3px 8px; border-radius: 12px; font-weight: bold;
      cursor: pointer; font-size: 9.5px; height: 26px; pointer-events: auto;
    }

    .btn-mic {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(20, 16, 38, 0.9); border: 1px solid #ff75a0;
      color: #fff; font-size: 11px; display: flex;
      align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; pointer-events: auto;
    }
    .btn-mic.active { background: #ff75a0; }

    /* Joystick ขนาดเล็ก */
    #joystick-base {
      position: absolute; bottom: 15px; left: 15px;
      width: 80px; height: 80px;
      background: rgba(78, 168, 222, 0.15);
      border: 1.5px solid rgba(255, 117, 160, 0.5);
      border-radius: 50%;
      pointer-events: auto; touch-action: none; cursor: pointer; z-index: 20;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 30px; height: 30px;
      background: rgba(255, 117, 160, 0.85);
      border: 1.5px solid #90e0ef;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .elevator-prompt {
      position: absolute; bottom: 100px; right: 15px;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(76, 201, 240, 0.4);
      border: 1.5px solid #4cc9f0;
      color: #fff; font-size: 16px;
      display: none; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; z-index: 20;
    }
    .elevator-prompt.sky { background: rgba(247, 37, 133, 0.4); border-color: #f72585; }

    .btn-jump { 
      position: absolute; bottom: 50px; right: 15px; width: 42px; height: 42px; 
      border-radius: 50%; background: rgba(78, 168, 222, 0.4); 
      border: 1.5px solid #4ea8de; color: #fff; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; z-index: 20;
    }
    .btn-jump:active { background: rgba(255, 117, 160, 0.8); }

    #checkin-prompt {
      position: absolute; bottom: 150px; right: 15px;
      background: #ff75a0; border: 1px solid #fff; color: #fff;
      padding: 5px 10px; border-radius: 18px; font-weight: bold; font-size: 9px;
      display: none; pointer-events: auto; cursor: pointer; z-index: 20;
      box-shadow: 0 0 8px rgba(255, 117, 160, 0.8);
      white-space: nowrap;
    }

    #warp-notice {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 5, 25, 0.9); border: 1.5px solid #7209b7;
      color: #e0aaff; padding: 10px 20px; border-radius: 20px;
      font-size: 14px; font-weight: bold; text-align: center;
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 30;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <audio id="bgm-player" loop preload="metadata">
    <source src="./202608152209.mp3" type="audio/mpeg">
  </audio>

  <div id="ui-layer">
    <div class="hud-box">
      <div class="hud-title">🐰 28 SIGNS</div>
      <div>ชื่อ: <input type="text" id="player-name-input" class="name-input" value="Bunny" placeholder="ไม่เกิน 7 ตัว"></div>
      <div style="margin-top:1px;">สถานะ: <span id="checkin-status" style="color:#ff85a1;">ยังไม่เช็คอิน</span></div>
      <div style="margin-top:1px; font-size:8.5px; color:#4ea8de;">โซน: <span id="zone-status">ห้องจัดแสดงหลัก</span></div>
    </div>

    <button class="btn-music" id="btn-music">🔊 BGM: ปิด</button>

    <div id="chat-history">
      <div class="chat-msg"><span class="author">ระบบ:</span> ยินดีต้อนรับสู่นิทรรศการ!</div>
    </div>

    <div id="chat-container">
      <button class="btn-mic" id="btn-mic" title="เปิด/ปิดไมค์">🎙️</button>
      <input type="text" id="chat-input" class="chat-input" placeholder="พิมพ์ข้อความคุยที่นี่...">
      <button class="btn-send" id="btn-send">ส่ง</button>
    </div>

    <div id="checkin-prompt">📝 เช็คอิน / แก้ไขป้าย</div>
    <div id="elevator-prompt">🛗</div>
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div class="btn-jump" id="btn-jump">🦘</div>
    <div id="warp-notice">🔮 กำลังข้ามประตูมิติ...</div>
  </div>

  <script>
    const bgmPlayer = document.getElementById('bgm-player');
    const btnMusic = document.getElementById('btn-music');
    let isMusicPlaying = false;
    const MUSIC_FILE = './202608152209.mp3';

    bgmPlayer.volume = 0.65;
    bgmPlayer.preload = 'metadata';
    bgmPlayer.src = new URL(MUSIC_FILE, document.baseURI).href;
    bgmPlayer.load();

    function setMusicButton(playing) {
      isMusicPlaying = playing;
      if (playing) {
        btnMusic.innerText = '🎶 BGM: เปิด 🔊';
        btnMusic.classList.add('active');
      } else {
        btnMusic.innerText = '🔊 BGM: ปิด';
        btnMusic.classList.remove('active');
      }
    }

    async function toggleMusic() {
      try {
        if (bgmPlayer.paused) {
          await bgmPlayer.play();
          setMusicButton(true);
        } else {
          bgmPlayer.pause();
          setMusicButton(false);
        }
      } catch (err) {
        setMusicButton(false);
        btnMusic.innerText = '⚠️ กดอีกครั้ง';
      }
    }

    bgmPlayer.addEventListener('play', () => setMusicButton(true));
    bgmPlayer.addEventListener('pause', () => setMusicButton(false));
    bgmPlayer.addEventListener('ended', () => setMusicButton(false));
    btnMusic.addEventListener('click', toggleMusic);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1838);
    scene.fog = new THREE.FogExp2(0x1a1838, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xd8b4fe, 0.65);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x4ea8de, 0.9);
    dirLight.position.set(50, 80, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const ROOM_SIZE = 250;
    const BOUNDARY = (ROOM_SIZE / 2) - 4;

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE),
      new THREE.MeshStandardMaterial({ color: 0x4da63b, roughness: 0.7 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(ROOM_SIZE, 100, 0xff75a0, 0x48cae4);
    grid.position.y = 0.01;
    scene.add(grid);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xe0f2fe, roughness: 0.5 });
    function addWall(w, h, d, x, y, z) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      wall.position.set(x, y, z);
      wall.castShadow = wall.receiveShadow = true;
      scene.add(wall);
    }
    const WALL_H = 18;
    addWall(ROOM_SIZE, WALL_H, 3, 0, WALL_H/2, -ROOM_SIZE/2);
    addWall(ROOM_SIZE, WALL_H, 3, 0, WALL_H/2, ROOM_SIZE/2);
    addWall(3, WALL_H, ROOM_SIZE, -ROOM_SIZE/2, WALL_H/2, 0);
    addWall(3, WALL_H, ROOM_SIZE, ROOM_SIZE/2, WALL_H/2, 0);

    const STAR_AREA_X = 0;
    const STAR_AREA_Z = 0;
    const STAR_AREA_RADIUS = 32;

    const starAreaGroup = new THREE.Group();
    starAreaGroup.position.set(STAR_AREA_X, 0, STAR_AREA_Z);
    scene.add(starAreaGroup);

    const starDeck = new THREE.Mesh(
      new THREE.CylinderGeometry(STAR_AREA_RADIUS, STAR_AREA_RADIUS, 0.35, 96),
      new THREE.MeshStandardMaterial({ color: 0x11162f, roughness: 0.28, metalness: 0.35 })
    );
    starDeck.position.y = 0.18;
    starDeck.receiveShadow = true;
    starAreaGroup.add(starDeck);

    const starRing = new THREE.Mesh(
      new THREE.TorusGeometry(STAR_AREA_RADIUS - 2, 0.45, 16, 96),
      new THREE.MeshBasicMaterial({ color: 0x4cc9f0 })
    );
    starRing.rotation.x = Math.PI / 2;
    starRing.position.y = 0.45;
    starAreaGroup.add(starRing);

    const starRing2 = new THREE.Mesh(
      new THREE.TorusGeometry(STAR_AREA_RADIUS - 7, 0.12, 12, 96),
      new THREE.MeshBasicMaterial({ color: 0xf72585 })
    );
    starRing2.rotation.x = Math.PI / 2;
    starRing2.position.y = 0.48;
    starAreaGroup.add(starRing2);

    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const light = new THREE.PointLight(i % 2 === 0 ? 0x4cc9f0 : 0xf72585, 0.55, 7);
      light.position.set(Math.cos(a) * (STAR_AREA_RADIUS - 3), 1.2, Math.sin(a) * (STAR_AREA_RADIUS - 3));
      starAreaGroup.add(light);
    }

    function createDoubleSidedSign(width, height, drawFuncFront, drawFuncBack, posX, posY, posZ, rotY) {
      const group = new THREE.Group();
      group.position.set(posX, posY, posZ);
      group.rotation.y = rotY;

      const canvasFront = document.createElement('canvas');
      canvasFront.width = 900; canvasFront.height = 240;
      drawFuncFront(canvasFront.getContext('2d'));
      const planeFront = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvasFront), transparent: true })
      );
      planeFront.position.z = 0.02;
      group.add(planeFront);

      const canvasBack = document.createElement('canvas');
      canvasBack.width = 900; canvasBack.height = 240;
      drawFuncBack(canvasBack.getContext('2d'));
      
      const planeBack = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvasBack), transparent: true })
      );
      planeBack.rotation.y = Math.PI;
      planeBack.position.z = -0.02;
      group.add(planeBack);

      return group;
    }

    const starSignGroup = createDoubleSidedSign(
      16, 4.25,
      (ctx) => {
        ctx.fillStyle = 'rgba(10, 12, 35, 0.92)';
        ctx.roundRect(20, 20, 860, 200, 40);
        ctx.fill();
        ctx.strokeStyle = '#4cc9f0'; ctx.lineWidth = 8; ctx.stroke();
        ctx.font = '900 64px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✦ STAR VIEWING AREA ✦', 450, 105);
        ctx.font = 'bold 30px "Segoe UI", sans-serif';
        ctx.fillStyle = '#90e0ef';
        ctx.fillText('ลานดูดาวกลางนิทรรศการ', 450, 170);
      },
      (ctx) => {
        ctx.fillStyle = 'rgba(10, 12, 35, 0.92)';
        ctx.roundRect(20, 20, 860, 200, 40);
        ctx.fill();
        ctx.strokeStyle = '#4cc9f0'; ctx.lineWidth = 8; ctx.stroke();
        ctx.font = '900 64px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✦ STAR VIEWING AREA ✦', 450, 105);
        ctx.font = 'bold 30px "Segoe UI", sans-serif';
        ctx.fillStyle = '#90e0ef';
        ctx.fillText('ลานดูดาวกลางนิทรรศการ', 450, 170);
      },
      0, 4.2, -25, 0
    );
    starAreaGroup.add(starSignGroup);

    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const seat = new THREE.Mesh(
        new THREE.BoxGeometry(5.5, 0.55, 2.0),
        new THREE.MeshStandardMaterial({ color: 0x252a4a, roughness: 0.5, metalness: 0.2 })
      );
      seat.position.set(Math.cos(a) * 21, 0.8, Math.sin(a) * 21);
      seat.rotation.y = -a;
      seat.castShadow = true;
      starAreaGroup.add(seat);
    }

    function addTelescope(x, z, rotationY) {
      const group = new THREE.Group();
      group.position.set(x, 0.6, z);
      group.rotation.y = rotationY;

      const tripod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.22, 3.2, 12),
        new THREE.MeshStandardMaterial({ color: 0x8d99ae, metalness: 0.7, roughness: 0.3 })
      );
      tripod.position.y = 1.6;
      group.add(tripod);

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.7, 0.7, 3.8, 24),
        new THREE.MeshStandardMaterial({ color: 0x4cc9f0, metalness: 0.55, roughness: 0.25 })
      );
      body.rotation.z = Math.PI / 2;
      body.position.set(0, 3.2, 0);
      group.add(body);

      const lens = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.48, 0.18, 24),
        new THREE.MeshBasicMaterial({ color: 0xf72585 })
      );
      lens.rotation.z = Math.PI / 2;
      lens.position.set(1.98, 3.2, 0);
      group.add(lens);

      starAreaGroup.add(group);
    }
    addTelescope(-14, -8, 0.2);
    addTelescope(14, -8, -0.2);
    addTelescope(0, 15, Math.PI);

    const starPositions = [];
    const starColors = [];
    for (let i = 0; i < 900; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.48 + 0.08;
      const radius = 120 + Math.random() * 110;
      starPositions.push(Math.sin(phi) * Math.cos(theta) * radius, Math.cos(phi) * radius + 25, Math.sin(phi) * Math.sin(theta) * radius);
      starColors.push(0.65 + Math.random() * 0.35, 0.72 + Math.random() * 0.28, 1.0);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
    const starField = new THREE.Points(starGeometry, new THREE.PointsMaterial({ size: 0.85, transparent: true, opacity: 0.9, vertexColors: true }));
    scene.add(starField);

    const ELEVATOR_X = 18;
    const ELEVATOR_Z = 0;
    const ELEVATOR_GROUND_Y = 0.05;
    const ELEVATOR_TOP_Y = 65;
    const ELEVATOR_SPEED = 0.4;

    const elevatorGroup = new THREE.Group();
    elevatorGroup.position.set(ELEVATOR_X, ELEVATOR_GROUND_Y, ELEVATOR_Z);
    scene.add(elevatorGroup);

    const elevatorPlatform = new THREE.Mesh(
      new THREE.CylinderGeometry(4.5, 4.5, 0.5, 48),
      new THREE.MeshStandardMaterial({ color: 0x202640, roughness: 0.25, metalness: 0.65 })
    );
    elevatorPlatform.position.y = -0.25;
    elevatorPlatform.receiveShadow = true;
    elevatorGroup.add(elevatorPlatform);

    const elevatorGlowRing = new THREE.Mesh(
      new THREE.TorusGeometry(4.2, 0.18, 12, 48),
      new THREE.MeshBasicMaterial({ color: 0x4cc9f0 })
    );
    elevatorGlowRing.rotation.x = Math.PI / 2;
    elevatorGlowRing.position.y = 0.1;
    elevatorGroup.add(elevatorGlowRing);

    for (const x of [-3.5, 3.5]) {
      for (const z of [-3.5, 3.5]) {
        const post = new THREE.Mesh(
          new THREE.BoxGeometry(0.35, 9, 0.35),
          new THREE.MeshStandardMaterial({ color: 0x4a4e69, metalness: 0.7, roughness: 0.25 })
        );
        post.position.set(x, 4.5, z);
        elevatorGroup.add(post);
      }
    }

    const elevatorRoof = new THREE.Mesh(
      new THREE.BoxGeometry(8, 0.35, 8),
      new THREE.MeshStandardMaterial({ color: 0x171a30, metalness: 0.5, roughness: 0.3 })
    );
    elevatorRoof.position.y = 9;
    elevatorGroup.add(elevatorRoof);

    for (const sx of [-5.2, 5.2]) {
      const shaft = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, ELEVATOR_TOP_Y, 0.45),
        new THREE.MeshStandardMaterial({ color: 0x24294a, metalness: 0.7, roughness: 0.22 })
      );
      shaft.position.set(ELEVATOR_X + sx, ELEVATOR_TOP_Y / 2, ELEVATOR_Z);
      scene.add(shaft);
    }

    const skyDeckGroup = new THREE.Group();
    skyDeckGroup.position.set(0, ELEVATOR_TOP_Y, 0);
    scene.add(skyDeckGroup);

    const skyDeck = new THREE.Mesh(
      new THREE.CylinderGeometry(29, 29, 0.45, 96),
      new THREE.MeshStandardMaterial({ color: 0x0b1028, roughness: 0.22, metalness: 0.45 })
    );
    skyDeck.position.y = -0.25;
    skyDeckGroup.add(skyDeck);

    const SMALL_ROOM_OFFSET_X = 600;
    const SMALL_ROOM_SIZE = 70;
    const SMALL_BOUNDARY = (SMALL_ROOM_SIZE / 2) - 4;

    const smallFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(SMALL_ROOM_SIZE, SMALL_ROOM_SIZE),
      new THREE.MeshStandardMaterial({ color: 0x3d8c32, roughness: 0.6 })
    );
    smallFloor.position.set(SMALL_ROOM_OFFSET_X, 0, 0);
    smallFloor.rotation.x = -Math.PI / 2;
    scene.add(smallFloor);

    const smallGrid = new THREE.GridHelper(SMALL_ROOM_SIZE, 30, 0xf72585, 0x7209b7);
    smallGrid.position.set(SMALL_ROOM_OFFSET_X, 0.01, 0);
    scene.add(smallGrid);

    const smallWallMat = new THREE.MeshStandardMaterial({ color: 0xe0f2fe, roughness: 0.5 });
    function addSmallWall(w, h, d, x, y, z) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), smallWallMat);
      wall.position.set(x, y, z);
      scene.add(wall);
    }
    addSmallWall(SMALL_ROOM_SIZE, WALL_H, 2, SMALL_ROOM_OFFSET_X, WALL_H/2, -SMALL_ROOM_SIZE/2);
    addSmallWall(SMALL_ROOM_SIZE, WALL_H, 2, SMALL_ROOM_OFFSET_X, WALL_H/2, SMALL_ROOM_SIZE/2);
    addSmallWall(2, WALL_H, SMALL_ROOM_SIZE, SMALL_ROOM_OFFSET_X - SMALL_ROOM_SIZE/2, WALL_H/2, 0);
    addSmallWall(2, WALL_H, SMALL_ROOM_SIZE, SMALL_ROOM_OFFSET_X + SMALL_ROOM_SIZE/2, WALL_H/2, 0);

    const portals = [];
    let isWarping = false;
    let inSmallRoom = false;
    let exitedPortalYet = true;

    function createPortal(x, z, targetPos, labelStr) {
      const portalGroup = new THREE.Group();
      portalGroup.position.set(x, 0, z);

      const ringMesh = new THREE.Mesh(
        new THREE.TorusGeometry(3.5, 0.3, 16, 32),
        new THREE.MeshBasicMaterial({ color: 0x9d4edd, wireframe: true })
      );
      ringMesh.position.y = 4.5;
      portalGroup.add(ringMesh);

      const innerMesh = new THREE.Mesh(

    function getWrappedLines(ctx, text, maxWidth) {

        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          lines.push(currentLine); currentLine = chars[i];
        } else { currentLine = testLine; }
      }
      if (currentLine) lines.push(currentLine);
      return lines;

    const joystickBase = document.getElementById('joystick-base');

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickBase.getBoundingClientRect();
      let deltaX = clientX - (rect.left + rect.width / 2);
      let deltaY = clientY - (rect.top + rect.height / 2);
      let dist = Math.hypot(deltaX, deltaY);
      if (dist > 25) { deltaX = (deltaX / dist) * 25; deltaY = (deltaY / dist) * 25; }
      joystickKnob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
      joyInputX = deltaX / 25; joyInputY = deltaY / 25;
    }
    function resetJoystick() { joystickActive = false; joyInputX = 0; joyInputY = 0; joystickKnob.style.transform = `translate(-50%, -50%)`; }

    joystickBase.addEventListener('pointerdown', (e) => { e.preventDefault(); joystickActive = true; joystickBase.setPointerCapture(e.pointerId); handleJoystickMove(e.clientX, e.clientY); });
    joystickBase.addEventListener('pointermove', (e) => { if (joystickActive) handleJoystickMove(e.clientX, e.clientY); });
    joystickBase.addEventListener('pointerup', resetJoystick);

    let velocityY = 0, gravity = 0.018, isGrounded = true;

      if (['KeyW', 'ArrowUp'].includes(e.code)) keys.w = true;
      if (['KeyS', 'ArrowDown'].includes(e.code)) keys.s = true;
      if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.a = true;

    window.addEventListener('keyup', e => {

    // แยกการสัมผัสหน้าจอ: หมุนกล้องเฉพาะสัมผัสฝั่งขวาของหน้าจอ (Right Half)
    let cameraYaw = 0, cameraPitch = 0.4, isDraggingCam = false, prevCamX = 0, prevCamY = 0;
    
    window.addEventListener('pointerdown', e => {
      if (e.target.closest('#ui-layer')) return;
      if (e.clientX >= window.innerWidth / 2) {
        isDraggingCam = true; 
        prevCamX = e.clientX; 
        prevCamY = e.clientY;
      }
    });

    window.addEventListener('pointermove', e => {
      if (!isDraggingCam) return;
      cameraYaw -= (e.clientX - prevCamX) * 0.005;
      cameraPitch = Math.max(0.05, Math.min(1.2, cameraPitch + (e.clientY - prevCamY) * 0.005));
      prevCamX = e.clientX; 
      prevCamY = e.clientY;
    });

    window.addEventListener('pointerup', () => isDraggingCam = false);
    window.addEventListener('pointercancel', () => isDraggingCam = false);

    document.getElementById('btn-jump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
    function jump() { if (isGrounded) { velocityY = 0.48; isGrounded = false; } }

    const elevatorPrompt = document.getElementById('elevator-prompt');
    let elevatorState = 'ground', elevatorY = ELEVATOR_GROUND_Y, playerOnElevator = false;

    function isPlayerNearElevator() {
      return Math.hypot(bunnyGroup.position.x - ELEVATOR_X, bunnyGroup.position.z - ELEVATOR_Z) < 4.2 && Math.abs(bunnyGroup.position.y - elevatorY) < 5;
    }

    function useElevator() {
      if (!isPlayerNearElevator()) return;
      if (elevatorState === 'ground') { elevatorState = 'goingUp'; playerOnElevator = true; }
      else if (elevatorState === 'sky') { elevatorState = 'goingDown'; playerOnElevator = true; }
    }
    elevatorPrompt.addEventListener('pointerdown', (e) => { e.preventDefault(); useElevator(); });
    window.addEventListener('keydown', (e) => { if (e.code === 'KeyE') useElevator(); });

    let timeAcc = 0;
    function update() {
      timeAcc += 0.03;
      centerTitleGroup.position.y = 18 + Math.sin(timeAcc) * 0.6;
      centerTitleGroup.rotation.y += 0.005;
      starField.rotation.y += 0.00008;

      let inputForward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0) - joyInputY;
      let inputRight = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joyInputX;
      let inputLen = Math.hypot(inputForward, inputRight);

      const elevatorMoving = elevatorState === 'goingUp' || elevatorState === 'goingDown';
      if (!elevatorMoving && !playerOnElevator && inputLen > 0.05) {
        const speed = 0.38 * Math.min(1, inputLen);
        const moveX = ((inputForward / inputLen) * -Math.sin(cameraYaw)) + ((inputRight / inputLen) * Math.cos(cameraYaw));
        const moveZ = ((inputForward / inputLen) * -Math.cos(cameraYaw)) + ((inputRight / inputLen) * -Math.sin(cameraYaw));
        bunnyGroup.position.x += moveX * speed;
        bunnyGroup.position.z += moveZ * speed;
        bunnyGroup.rotation.y = Math.atan2(moveX, moveZ);
      }

      if (elevatorState === 'goingUp') {
        elevatorY = Math.min(ELEVATOR_TOP_Y, elevatorY + ELEVATOR_SPEED);
        if (elevatorY >= ELEVATOR_TOP_Y) { elevatorY = ELEVATOR_TOP_Y; elevatorState = 'sky'; playerOnElevator = true; zoneStatusText.innerText = 'ลานดูดาว (65ม.)'; }
      } else if (elevatorState === 'goingDown') {
        elevatorY = Math.max(ELEVATOR_GROUND_Y, elevatorY - ELEVATOR_SPEED);
        if (elevatorY <= ELEVATOR_GROUND_Y) { elevatorY = ELEVATOR_GROUND_Y; elevatorState = 'ground'; playerOnElevator = true; zoneStatusText.innerText = 'ห้องหลัก'; }
      }

      elevatorGroup.position.y = elevatorY;
      const onSkyLevel = elevatorY > 5 && (bunnyGroup.position.y > 5);

      if (playerOnElevator) {
        if (elevatorMoving || inputLen <= 0.05) {
          bunnyGroup.position.set(ELEVATOR_X, elevatorY, ELEVATOR_Z);
          velocityY = 0; isGrounded = true;
        } else {
          playerOnElevator = false;
          bunnyGroup.position.x += Math.cos(cameraYaw) * 2.0;
          bunnyGroup.position.z += -Math.sin(cameraYaw) * 2.0;
        }
      } else {
        bunnyGroup.position.y += velocityY;
        if (!isGrounded) velocityY -= gravity;
        let floorY = (elevatorState === 'sky') ? ELEVATOR_TOP_Y : 0;
        if (bunnyGroup.position.y <= floorY) { bunnyGroup.position.y = floorY; velocityY = 0; isGrounded = true; }
      }

      if (inSmallRoom) {
        bunnyGroup.position.x = Math.max(SMALL_ROOM_OFFSET_X - SMALL_BOUNDARY, Math.min(SMALL_ROOM_OFFSET_X + SMALL_BOUNDARY, bunnyGroup.position.x));
        bunnyGroup.position.z = Math.max(-SMALL_BOUNDARY, Math.min(SMALL_BOUNDARY, bunnyGroup.position.z));
      } else if (onSkyLevel) {
        let skyDist = Math.hypot(bunnyGroup.position.x, bunnyGroup.position.z);
        if (skyDist > 27) {
          let angle = Math.atan2(bunnyGroup.position.z, bunnyGroup.position.x);
          bunnyGroup.position.x = Math.cos(angle) * 27;
          bunnyGroup.position.z = Math.sin(angle) * 27;
        }
      } else {
        bunnyGroup.position.x = Math.max(-BOUNDARY, Math.min(BOUNDARY, bunnyGroup.position.x));
        bunnyGroup.position.z = Math.max(-BOUNDARY, Math.min(BOUNDARY, bunnyGroup.position.z));
      }

      let nearAnyPortal = false;
      if (!onSkyLevel) {
        for (let portal of portals) {
          if (bunnyGroup.position.distanceTo(portal.pos) < 4.5) {
            nearAnyPortal = true;
            if (!isWarping && exitedPortalYet) {
              isWarping = true; exitedPortalYet = false;
              warpNotice.innerText = `🔮 กำลังวาร์ปไปยัง: ${portal.label}`; warpNotice.style.opacity = '1';
              setTimeout(() => {
                bunnyGroup.position.copy(portal.targetPos);
                inSmallRoom = (portal.targetPos.x > 300);
                zoneStatusText.innerText = inSmallRoom ? "ห้องลับ" : "ห้องหลัก";
              }, 300);
              setTimeout(() => { warpNotice.style.opacity = '0'; isWarping = false; }, 1200);
            }
            break;
          }
        }
      }
      if (!nearAnyPortal && portals.every(p => bunnyGroup.position.distanceTo(p.pos) >= 6)) exitedPortalYet = true;

      nearbySign = null;
      for (let sign of signs) {
        if (bunnyGroup.position.distanceTo(sign.position) < 20) { nearbySign = sign; break; }
      }

      if (nearbySign) {
        checkinBtn.style.display = 'flex';
        checkinBtn.innerText = nearbySign.ownerId === "my_player_id" ? `✏️ แก้ไขป้าย #${nearbySign.index + 1}` : (nearbySign.ownerId !== null ? `🔒 ป้าย #${nearbySign.index + 1} (มีเจ้าของ)` : `📝 เช็คอินป้าย #${nearbySign.index + 1}`);
      } else {
        checkinBtn.style.display = 'none';
      }

      if (isPlayerNearElevator() && !elevatorMoving) {
        elevatorPrompt.style.display = 'flex';
        if (elevatorState === 'ground') {
          elevatorPrompt.className = 'elevator-prompt';
          elevatorPrompt.innerText = '🛗';
        } else {
          elevatorPrompt.className = 'elevator-prompt sky';
          elevatorPrompt.innerText = '⬇️';
        }
      } else if (!elevatorMoving) {
        elevatorPrompt.style.display = 'none';
      }

      let camDist = 16;
      let targetCamX = bunnyGroup.position.x + camDist * Math.sin(cameraYaw) * Math.cos(cameraPitch);
      let targetCamY = bunnyGroup.position.y + camDist * Math.sin(cameraPitch) + 2;
      let targetCamZ = bunnyGroup.position.z + camDist * Math.cos(cameraYaw) * Math.cos(cameraPitch);
      camera.position.set(targetCamX, targetCamY, targetCamZ);
      camera.lookAt(bunnyGroup.position.x, bunnyGroup.position.y + 1.6, bunnyGroup.position.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
