<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Bunny - Night Sky & Stylized Grass</title>
  <style>
html, body { touch-action: none; overscroll-behavior: none; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050814; touch-action: none; }

    canvas { position: absolute; top: 0; left: 0; z-index: 1; outline: none; }

    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    
    .hud-box { 
      position: absolute; top: 6px; left: 6px; 
      background: rgba(15, 12, 30, 0.88); border: 1px solid #ff75a0; 
      padding: 4px 8px; border-radius: 6px; color: #fff; font-size: 9px;
      box-shadow: 0 0 6px rgba(255, 117, 160, 0.3); pointer-events: auto;
      max-width: 135px;
    }
    .hud-title { color: #4ea8de; font-weight: bold; font-size: 9.5px; margin-bottom: 1px; }
    
    .name-input {
      background: rgba(255, 255, 255, 0.15); border: 1px solid #4ea8de;
      color: #fff; padding: 1px 4px; border-radius: 3px; width: 80px;
      font-size: 9px; margin-top: 1px; outline: none; pointer-events: auto;
    }

    .btn-music {
      position: absolute; top: 6px; right: 6px;
      background: rgba(15, 12, 30, 0.88); border: 1px solid #ff75a0;
      color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 9px; font-weight: bold;
      cursor: pointer; pointer-events: auto; z-index: 20;
      box-shadow: 0 0 6px rgba(255, 117, 160, 0.3);
      display: flex; align-items: center; gap: 3px;
    }
    .btn-music.active { border-color: #4ea8de; box-shadow: 0 0 8px rgba(78, 168, 222, 0.5); }

    .btn-fullscreen {
      position: absolute; top: 38px; right: 6px;
      background: rgba(15, 12, 30, 0.88); border: 1px solid #4cc9f0;
      color: #fff; padding: 3px 8px; border-radius: 12px;
      font-size: 9px; font-weight: bold; cursor: pointer;
      pointer-events: auto; z-index: 20;
      box-shadow: 0 0 6px rgba(76, 201, 240, 0.3);
      white-space: nowrap; touch-action: manipulation;
    }
    .btn-fullscreen:active { background: rgba(76, 201, 240, 0.35); }

    @media (max-width: 600px) {
      .btn-fullscreen { top: 36px; font-size: 8.5px; padding: 3px 7px; }
      #joystick-base { width: 116px; height: 116px; bottom: max(15px, env(safe-area-inset-bottom)); left: max(15px, env(safe-area-inset-left)); }
      .btn-jump { bottom: max(52px, calc(env(safe-area-inset-bottom) + 40px)); right: max(18px, env(safe-area-inset-right)); }
      #chat-container { bottom: max(6px, env(safe-area-inset-bottom)); }
    }

    #chat-history {
      position: absolute; bottom: 42px; left: 50%;
      transform: translateX(-50%);
      width: 70%; max-width: 300px; height: 35px;
      background: rgba(10, 8, 20, 0.85);
      border: 1px solid rgba(78, 168, 222, 0.3);
      border-radius: 6px; padding: 2px 6px;
      overflow-y: auto; pointer-events: auto;
      display: flex; flex-direction: column; gap: 2px;
      font-size: 9px; color: #fff;
      backdrop-filter: blur(3px);
    }
    #chat-history::-webkit-scrollbar { width: 3px; }
    #chat-history::-webkit-scrollbar-thumb { background: #4ea8de; border-radius: 10px; }
    
    .chat-msg { word-break: break-word; line-height: 1.2; }
    .chat-msg .author { color: #ff75a0; font-weight: bold; }
    .chat-msg .time { color: #7209b7; font-size: 8px; margin-left: 3px; opacity: 0.8; }

    #chat-container {
      position: absolute; bottom: 6px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px;
      width: 70%; max-width: 300px;
      pointer-events: auto; z-index: 20;
    }

    .chat-input {
      flex: 1;
      background: rgba(10, 8, 20, 0.9);
      border: 1px solid #4ea8de;
      color: #fff; padding: 3px 8px; border-radius: 14px;
      font-size: 9.5px; outline: none; height: 26px; pointer-events: auto;
    }
    .chat-input::placeholder { color: #a0a0c0; }

    .btn-send {
      background: #4ea8de; border: none; color: #fff;
      padding: 3px 8px; border-radius: 12px; font-weight: bold;
      cursor: pointer; font-size: 9.5px; height: 26px; pointer-events: auto;
    }

    .btn-mic {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(15, 12, 30, 0.9); border: 1px solid #ff75a0;
      color: #fff; font-size: 11px; display: flex;
      align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; pointer-events: auto;
    }
    .btn-mic.active { background: #ff75a0; }

    #joystick-base {
      position: absolute; bottom: 15px; left: 15px;
      width: 110px; height: 110px;
      background: rgba(78, 168, 222, 0.15);
      border: 1.5px solid rgba(255, 117, 160, 0.5);
      border-radius: 50%;
      pointer-events: auto; touch-action: none; cursor: pointer; z-index: 20;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 44px; height: 44px;
      background: rgba(255, 117, 160, 0.85);
      border: 1.5px solid #90e0ef;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .elevator-prompt {
      position: absolute; bottom: 125px; right: 18px;
      width: 58px; height: 58px;
      border-radius: 50%;
      background: rgba(76, 201, 240, 0.4);
      border: 1.5px solid #4cc9f0;
      color: #fff; font-size: 23px;
      display: none; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; z-index: 20;
    }
    .elevator-prompt.sky { background: rgba(247, 37, 133, 0.4); border-color: #f72585; }

    .btn-jump { 
      position: absolute; bottom: 52px; right: 18px; width: 58px; height: 58px; 
      border-radius: 50%; background: rgba(78, 168, 222, 0.4); 
      border: 1.5px solid #4ea8de; color: #fff; font-size: 23px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer; z-index: 20;
    }
    .btn-jump:active { background: rgba(255, 117, 160, 0.8); }

    #checkin-prompt {
      position: absolute; bottom: 150px; right: 15px;
      background: #ff75a0; border: 1px solid #fff; color: #fff;
      padding: 5px 10px; border-radius: 18px; font-weight: bold; font-size: 9px;
      display: none; pointer-events: auto; cursor: pointer; z-index: 20;
      box-shadow: 0 0 8px rgba(255, 117, 160, 0.8);
      white-space: nowrap;
    }

    #warp-notice {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 5, 25, 0.9); border: 1.5px solid #7209b7;
      color: #e0aaff; padding: 10px 20px; border-radius: 20px;
      font-size: 14px; font-weight: bold; text-align: center;
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 30;
    }

    /* --- Game Dialog UI --- */
    #game-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 450px; background: rgba(12, 10, 26, 0.95);
      border: 2px solid #9d4edd; border-radius: 16px; padding: 20px;
      color: #fff; z-index: 100; display: none; flex-direction: column;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.5); backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .modal-close-x {
      position: absolute; top: 10px; right: 14px;
      background: transparent; border: none; color: #ff75a0;
      font-size: 18px; font-weight: bold; cursor: pointer;
      transition: color 0.2s;
    }
    .modal-close-x:hover { color: #fff; }

    #game-title { font-size: 15px; font-weight: bold; color: #ff75a0; margin-bottom: 6px; text-align: center; padding-right: 15px; }
    #game-progress { font-size: 11px; color: #4ea8de; margin-bottom: 10px; text-align: center; }
    #game-question { font-size: 13px; line-height: 1.4; margin-bottom: 14px; text-align: center; min-height: 38px; }
    .game-options { display: flex; flex-direction: column; gap: 6px; }
    .btn-option {
      background: rgba(255, 255, 255, 0.08); border: 1px solid #4ea8de;
      color: #fff; padding: 7px 10px; border-radius: 8px; font-size: 11.5px;
      cursor: pointer; transition: all 0.2s ease; text-align: left;
    }
    .btn-option:hover { background: rgba(78, 168, 222, 0.3); border-color: #ff75a0; }
    #game-result { display: none; flex-direction: column; text-align: center; gap: 12px; }
    #result-text { font-size: 13px; line-height: 1.5; color: #e0aaff; white-space: pre-line; }
    .btn-close-game {
      background: #ff75a0; border: none; color: #fff; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; cursor: pointer; align-self: center; margin-top: 10px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style id="high-quality-rendering">
html, body {
    image-rendering: auto;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
canvas {
    image-rendering: auto;
    -webkit-tap-highlight-color: transparent;
}
img, video {
    image-rendering: auto;
}
</style>


<style id="multi-touch-protection">
html, body, canvas {
  touch-action: none !important;
  overscroll-behavior: none !important;
}
</style>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#060919">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style id="pwa-fullscreen-safe-area">
html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}
@supports (padding: env(safe-area-inset-top)) {
  body {
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
  }
}
@media all and (display-mode: fullscreen), (display-mode: standalone) {
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
  }
}
</style>

</head>
<body>

  <audio id="bgm-player" loop preload="metadata">
    <source src="./202608152209.mp3" type="audio/mpeg">
  </audio>

  <div id="ui-layer">
    <div class="hud-box">
      <div class="hud-title">🐰 28 SIGNS</div>
      <div>ชื่อ: <input type="text" id="player-name-input" class="name-input" value="Bunny" placeholder="ไม่เกิน 7 ตัว"></div>
      <div style="margin-top:1px;">สถานะ: <span id="checkin-status" style="color:#ff85a1;">ยังไม่เช็คอิน</span></div>
      <div style="margin-top:1px; font-size:8.5px; color:#4ea8de;">โซน: <span id="zone-status">ห้องจัดแสดงหลัก</span></div>
    </div>

    <button class="btn-music" id="btn-music">🔊 BGM: ปิด</button>
    <button class="btn-fullscreen" id="fullscreenBtn" type="button" aria-label="เต็มจอ">⛶ เต็มจอ</button>

    <div id="chat-history">
      <div class="chat-msg"><span class="author">ระบบ:</span> ยินดีต้อนรับสู่นิทรรศการราตรี!</div>
    </div>

    <div id="chat-container">
      <button class="btn-mic" id="btn-mic" title="เปิด/ปิดไมค์">🎙️</button>
      <input type="text" id="chat-input" class="chat-input" placeholder="พิมพ์ข้อความคุยที่นี่...">
      <button class="btn-send" id="btn-send">ส่ง</button>
    </div>

    <div id="checkin-prompt">📝 เช็คอิน / แก้ไขป้าย</div>
    <button id="cancel-checkin-btn" style="display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:92px; z-index:30; pointer-events:auto; touch-action:manipulation; padding:7px 13px; border:1px solid #ff6b8a; border-radius:10px; background:rgba(25,8,15,.92); color:#ff9ab0; font-weight:bold; font-size:11px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35);">❌ ยกเลิกเช็คอิน</button>
    <div id="elevator-prompt">🛗</div>
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div class="btn-jump" id="btn-jump">🦘</div>
    <div id="warp-notice">🔮 กำลังข้ามประตูมิติ...</div>

    <div id="game-modal">
      <button class="modal-close-x" id="modal-close-x">✕</button>
      <div id="game-quiz-view">
        <div id="game-title">ชื่อเกม</div>
        <div id="game-progress">คำถามข้อที่ 1 / 7</div>
        <div id="game-question">ข้อความคำถาม...</div>
        <div class="game-options" id="game-options"></div>
      </div>
      <div id="game-result">
        <div style="font-size: 16px; font-weight: bold; color: #4ea8de;">✨ บทสรุปและคำให้กำลังใจ ✨</div>
        <div id="result-text">...</div>
        <button class="btn-close-game" id="btn-close-game">กลับสู่ห้อง exhibition</button>
      </div>
    </div>
  </div>

  <script>
    const bgmPlayer = document.getElementById('bgm-player');
    const btnMusic = document.getElementById('btn-music');
    let isMusicPlaying = false;
    const MUSIC_FILE = './202608152209.mp3';

    bgmPlayer.volume = 0.65;
    bgmPlayer.preload = 'metadata';
    bgmPlayer.src = new URL(MUSIC_FILE, document.baseURI).href;
    bgmPlayer.load();

    function setMusicButton(playing) {
      isMusicPlaying = playing;
      if (playing) {
        btnMusic.innerText = '🎶 BGM: เปิด 🔊';
        btnMusic.classList.add('active');
      } else {
        btnMusic.innerText = '🔊 BGM: ปิด';
        btnMusic.classList.remove('active');
      }
    }

    async function toggleMusic() {
      try {
        if (bgmPlayer.paused) {
          await bgmPlayer.play();
          setMusicButton(true);
        } else {
          bgmPlayer.pause();
          setMusicButton(false);
        }
      } catch (err) {
        setMusicButton(false);
        btnMusic.innerText = '⚠️ กดอีกครั้ง';
      }
    }

    bgmPlayer.addEventListener('play', () => setMusicButton(true));
    bgmPlayer.addEventListener('pause', () => setMusicButton(false));
    bgmPlayer.addEventListener('ended', () => setMusicButton(false));
    btnMusic.addEventListener('click', toggleMusic);

    // --- Scene & Night Atmosphere ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060919);
    scene.fog = new THREE.FogExp2(0x060919, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 3));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x7080b0, 0.85);
    scene.add(ambientLight);
    
    const moonLight = new THREE.DirectionalLight(0xb0c4de, 1.2);
    moonLight.position.set(-60, 120, -60);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 2048;
    moonLight.shadow.mapSize.height = 2048;
    moonLight.shadow.camera.near = 0.5;
    moonLight.shadow.camera.far = 500;
    scene.add(moonLight);

    // --- [อัปเดต] สร้างดวงจันทร์ให้สมจริงยิ่งขึ้น ---
    const moonGroup = new THREE.Group();
    moonGroup.position.set(-140, 180, -180);

    // สร้างพื้นผิวหลุมอุกกาบาต (Procedural Moon Crater Texture)
    function createRealisticMoonTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      
      // พื้นผิวสีเทานวลของดวงจันทร์
      ctx.fillStyle = '#d4d4d8';
      ctx.fillRect(0, 0, 1024, 512);

      // วาดรอยด่างและหลุมอุกกาบาต (Craters)
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 512;
        const r = Math.random() * 25 + 2;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(80, 80, 90, 0.45)');
        grad.addColorStop(0.7, 'rgba(120, 120, 130, 0.2)');
        grad.addColorStop(1, 'rgba(212, 212, 216, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(22, 48, 48),
      new THREE.MeshStandardMaterial({ 
        map: createRealisticMoonTexture(), 
        roughness: 0.9, 
        metalness: 0.1,
        emissive: 0x222222,
        emissiveIntensity: 0.2
      })
    );
    moonGroup.add(moonMesh);

    // ชั้นแสงเรืองรอบดวงจันทร์ (Moon Glow) ให้ดูละมุนและสมจริง
    const moonGlow = new THREE.Mesh(
      new THREE.SphereGeometry(28, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xfffdd0, transparent: true, opacity: 0.2, side: THREE.BackSide })
    );
    moonGroup.add(moonGlow);
    scene.add(moonGroup);

    function createStylizedGrassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = '#00ce42';
      ctx.fillRect(0, 0, 512, 512);

      const colors = ['#10e052', '#00b838', '#32ff6a', '#009a2d', '#73ff98'];
      for (let i = 0; i < 40000; i++) {
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const w = Math.random() * 2.5 + 1;
        const h = Math.random() * 9 + 3;
        ctx.fillRect(x, y, w, h);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(24, 24);
      return texture;
    }

    const grassTexture = createStylizedGrassTexture();

    const ROOM_SIZE = 250;
    const BOUNDARY = (ROOM_SIZE / 2) - 4;

    const floorMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.6, metalness: 0.05 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(ROOM_SIZE, 100, 0x4cc9f0, 0x1d3557);
    grid.position.y = 0.01;
    scene.add(grid);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x101830, roughness: 0.4 });
    function addWall(w, h, d, x, y, z) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      wall.position.set(x, y, z);
      wall.castShadow = wall.receiveShadow = true;
      scene.add(wall);
    }
    const WALL_H = 18;
    addWall(ROOM_SIZE, WALL_H, 3, 0, WALL_H/2, -ROOM_SIZE/2);
    addWall(ROOM_SIZE, WALL_H, 3, 0, WALL_H/2, ROOM_SIZE/2);
    addWall(3, WALL_H, ROOM_SIZE, -ROOM_SIZE/2, WALL_H/2, 0);
    addWall(3, WALL_H, ROOM_SIZE, ROOM_SIZE/2, WALL_H/2, 0);

    const STAR_AREA_X = 0;
    const STAR_AREA_Z = 0;
    const STAR_AREA_RADIUS = 32;

    const starAreaGroup = new THREE.Group();
    starAreaGroup.position.set(STAR_AREA_X, 0, STAR_AREA_Z);
    scene.add(starAreaGroup);

    const starDeck = new THREE.Mesh(
      new THREE.CylinderGeometry(STAR_AREA_RADIUS, STAR_AREA_RADIUS, 0.35, 96),
      new THREE.MeshStandardMaterial({ color: 0x11162f, roughness: 0.28, metalness: 0.35 })
    );
    starDeck.position.y = 0.18;
    starDeck.receiveShadow = true;
    starAreaGroup.add(starDeck);

    const starRing = new THREE.Mesh(
      new THREE.TorusGeometry(STAR_AREA_RADIUS - 2, 0.45, 16, 96),
      new THREE.MeshBasicMaterial({ color: 0x4cc9f0 })
    );
    starRing.rotation.x = Math.PI / 2;
    starRing.position.y = 0.45;
    starAreaGroup.add(starRing);

    const starRing2 = new THREE.Mesh(
      new THREE.TorusGeometry(STAR_AREA_RADIUS - 7, 0.12, 12, 96),
      new THREE.MeshBasicMaterial({ color: 0xf72585 })
    );
    starRing2.rotation.x = Math.PI / 2;
    starRing2.position.y = 0.48;
    starAreaGroup.add(starRing2);

    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const light = new THREE.PointLight(i % 2 === 0 ? 0x4cc9f0 : 0xf72585, 0.55, 7);
      light.position.set(Math.cos(a) * (STAR_AREA_RADIUS - 3), 1.2, Math.sin(a) * (STAR_AREA_RADIUS - 3));
      starAreaGroup.add(light);
    }

    function createWallSignForGame(x, z, rotY, titleText) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 320;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = 'rgba(12, 10, 26, 0.9)';
      if (ctx.roundRect) ctx.roundRect(15, 15, 994, 290, 40); else ctx.fillRect(15, 15, 994, 290);
      ctx.fill();
      ctx.lineWidth = 12; ctx.strokeStyle = '#ff75a0'; ctx.stroke();

      ctx.font = 'bold 64px "Segoe UI", sans-serif';
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(titleText, 512, 160);

      const texture = new THREE.CanvasTexture(canvas);
      const signMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 3.8),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true })
      );
      signMesh.position.set(x, 6.2, z);
      signMesh.rotation.y = rotY;
      scene.add(signMesh);
    }

    function createPortal(x, z, targetPos, labelStr, gameId = null, signText = null, signRotY = 0) {
      const portalGroup = new THREE.Group();
      portalGroup.position.set(x, 0, z);

      const themeColor = gameId ? 0xff75a0 : 0x9d4edd;
      const coreColor  = gameId ? 0xf72585 : 0x4cc9f0;

      const coreGeo = new THREE.SphereGeometry(2.2, 32, 32);
      const coreMat = new THREE.MeshBasicMaterial({ color: coreColor, transparent: true, opacity: 0.85 });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      coreMesh.position.y = 3.5;
      portalGroup.add(coreMesh);

      const outerRingGeo = new THREE.TorusGeometry(3.6, 0.18, 16, 64);
      const outerRingMat = new THREE.MeshBasicMaterial({ color: themeColor, wireframe: false });
      const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
      outerRing.position.y = 3.5;
      outerRing.rotation.x = Math.PI / 3; 
      portalGroup.add(outerRing);

      const innerRingGeo = new THREE.TorusGeometry(2.9, 0.12, 16, 64);
      const innerRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: false });
      const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
      innerRing.position.y = 3.5;
      innerRing.rotation.y = Math.PI / 4; 
      portalGroup.add(innerRing);

      const portalLight = new THREE.PointLight(themeColor, 1.5, 12);
      portalLight.position.y = 3.5;
      portalGroup.add(portalLight);

      scene.add(portalGroup);

      if (signText) {
        createWallSignForGame(x, z, signRotY, signText);
      }

      portals.push({ 
        group: portalGroup, 
        coreMesh: coreMesh,
        outerRing: outerRing,
        innerRing: innerRing,
        pos: new THREE.Vector3(x, 0, z), 
        targetPos: targetPos, 
        label: labelStr,
        gameId: gameId
      });
    }

    function startGame(gameId) {
      currentGameId = gameId;
      currentQIndex = 0;
      userAnswers = [];
      
      modalEl.style.display = 'flex';
      quizViewEl.style.display = 'block';
      resultViewEl.style.display = 'none';
      
      showQuestion();
    }

    function showQuestion() {
      const gameData = GAMES_DATA[currentGameId];
      const qData = gameData.questions[currentQIndex];
      
      titleEl.innerText = gameData.title;
      progressEl.innerText = `คำถามข้อที่ ${currentQIndex + 1} / 7`;
      questionEl.innerText = qData.q;
      
      optionsEl.innerHTML = '';
      qData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt.txt;
        btn.addEventListener('click', () => handleAnswer(opt.score));
        optionsEl.appendChild(btn);
      });
    }

    function handleAnswer(score) {
      userAnswers.push(score);
      currentQIndex++;
      
      if (currentQIndex < 7) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      quizViewEl.style.display = 'none';
      resultViewEl.style.display = 'flex';
      
      const counts = { A: 0, B: 0, C: 0, D: 0 };
      userAnswers.forEach(ans => { if(counts[ans] !== undefined) counts[ans]++; });
      
      let maxScore = -1;
      let mainTrend = 'A';
      for (const key in counts) {
        if (counts[key] > maxScore) {
          maxScore = counts[key];
          mainTrend = key;
        }
      }
      
      const resultMsg = GAMES_DATA[currentGameId].results[mainTrend] || GAMES_DATA[currentGameId].results['A'];
      resultTextEl.innerText = resultMsg;
    }

    function normalizePlayerName(name) {
      return String(name || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function cleanPlayerName(name) {
      return String(name || '').trim().replace(/\s+/g, ' ').slice(0, 7);
    }

    async function isNameAlreadyUsed(name, exceptUid = null) {
      const normalized = normalizePlayerName(name);
      if (!normalized) return false;

      const [playersSnap, signsSnap, registrySnap] = await Promise.all([
        playersRef.once('value'),
        signsRef.once('value'),
        nameRegistryRef.once('value')
      ]);

      const players = playersSnap.val() || {};
      for (const [uid, player] of Object.entries(players)) {
        if (exceptUid && String(uid) === String(exceptUid)) continue;
        if (normalizePlayerName(player && player.name) === normalized) return true;
      }

      const signsData = signsSnap.val() || {};
      for (const sign of Object.values(signsData)) {
        if (sign && normalizePlayerName(sign.ownerName) === normalized) {
          if (!exceptUid || String(sign.ownerId) !== String(exceptUid)) return true;
        }
      }

      const registeredUid = registrySnap.child(normalized).val();
      if (registeredUid && (!exceptUid || String(registeredUid) !== String(exceptUid))) return true;

      return false;
    }

    async function reservePlayerName(name, uid) {
      const cleanName = cleanPlayerName(name);
      const normalized = normalizePlayerName(cleanName);

      if (!cleanName) return { ok: false, reason: 'กรุณาตั้งชื่อก่อน' };
      if (cleanName.length > 7) return { ok: false, reason: 'ชื่อยาวเกิน 7 ตัวอักษร' };
      if (!normalized) return { ok: false, reason: 'ชื่อไม่ถูกต้อง' };

      // ตรวจทั้งข้อมูลผู้เล่น/ป้ายเดิมก่อน
      if (await isNameAlreadyUsed(cleanName, uid)) {
        return { ok: false, reason: `ชื่อ \"${cleanName}\" ถูกใช้งานแล้ว` };
      }

      // Transaction กันกรณีเพื่อน 2 คนตั้งชื่อเดียวกันพร้อมกัน
      const nameRef = nameRegistryRef.child(normalized);
      const result = await nameRef.transaction(current => {
        if (current === null || String(current) === String(uid)) return uid;
        return;
      });

      if (!result.committed) {
        return { ok: false, reason: `ชื่อ \"${cleanName}\" ถูกใช้งานแล้ว` };
      }

      return { ok: true, name: cleanName, normalized };
    }

    async function releasePlayerName(name, uid) {
      const normalized = normalizePlayerName(name);
      if (!normalized) return;
      const ref = nameRegistryRef.child(normalized);
      const snap = await ref.once('value');
      if (snap.exists() && String(snap.val()) === String(uid)) {
        await ref.remove();
      }
    }

    async function changePlayerName(newName) {
      if (!firebaseReady || !myPlayerId) {
        alert('กำลังเชื่อมต่อ Firebase กรุณารอสักครู่แล้วลองใหม่');
        return false;
      }

      const cleanName = cleanPlayerName(newName);
      if (!cleanName) {
        alert('กรุณาใส่ชื่อผู้เล่น');
        nameInput.value = currentPlayerName || 'Bunny';
        return false;
      }

      if (cleanName.length > 7) {
        alert('❌ ชื่อผู้เล่นต้องไม่เกิน 7 ตัวอักษร');
        nameInput.value = currentPlayerName;
        return false;
      }

      if (normalizePlayerName(cleanName) === normalizePlayerName(currentPlayerName)) {
        nameInput.value = currentPlayerName;
        return true;
      }

      const oldName = currentPlayerName;
      const reserved = await reservePlayerName(cleanName, myPlayerId);
      if (!reserved.ok) {
        alert(`❌ เปลี่ยนชื่อไม่ได้\n\n${reserved.reason}\n\nกรุณาเลือกชื่ออื่น`);
        nameInput.value = currentPlayerName;
        nameInput.style.borderColor = '#ff75a0';
        setTimeout(() => { nameInput.style.borderColor = '#4ea8de'; }, 1200);
        return false;
      }

      currentPlayerName = cleanName;
      nameInput.value = currentPlayerName;
      renderOverheadUI();

      try {
        await playersRef.child(myPlayerId).update({ name: currentPlayerName });
        if (normalizePlayerName(oldName) !== normalizePlayerName(currentPlayerName)) {
          await releasePlayerName(oldName, myPlayerId);
        }

        // อัปเดตชื่อบนป้ายของเราให้ตรงกับชื่อผู้เล่นใหม่
        const signsSnap = await signsRef.once('value');
        const updates = {};
        signsSnap.forEach(child => {
          const sign = child.val();
          if (sign && String(sign.ownerId) === String(myPlayerId)) {
            updates[`${child.key}/ownerName`] = currentPlayerName;
          }
        });
        if (Object.keys(updates).length) await signsRef.update(updates);

        // เปลี่ยนจุด onDisconnect ให้ลบชื่อใหม่เมื่อเครื่องนี้หลุด
        await nameRegistryRef.child(normalizePlayerName(currentPlayerName)).onDisconnect().remove();

        publishMyPlayer();
        return true;
      } catch (error) {
        console.error('Change player name error:', error);
        await releasePlayerName(currentPlayerName, myPlayerId).catch(() => {});
        const rollback = await reservePlayerName(oldName || 'Bunny', myPlayerId).catch(() => ({ ok: false }));
        currentPlayerName = rollback.ok ? rollback.name : 'Bunny';
        nameInput.value = currentPlayerName;
        renderOverheadUI();
        alert('เปลี่ยนชื่อไม่สำเร็จ\n' + error.message);
        return false;
      }
    }

    function createRemoteOverhead(name, micActive, message) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.name = 'remoteOverheadSprite';
      sprite.position.set(0, 5.2, 0);
      sprite.scale.set(5.5, 2.75, 1);

      const state = {
        name: String(name || 'เพื่อน'),
        mic: !!micActive,
        message: String(message || '')
      };

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const safeName = state.name.slice(0, 14);
        const safeMessage = state.message.slice(0, 24);

        if (safeMessage) {
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(60, 20, 904, 180, 32); else ctx.fillRect(60, 20, 904, 180);
          ctx.fill();
          ctx.lineWidth = 8;
          ctx.strokeStyle = '#4ea8de';
          ctx.stroke();
          ctx.font = 'bold 56px "Segoe UI", sans-serif';
          ctx.fillStyle = '#1a1838';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(safeMessage, 512, 110);
        }

        ctx.fillStyle = 'rgba(15,10,25,0.88)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(80, 280, 864, 160, 40); else ctx.fillRect(80, 280, 864, 160);
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = state.mic ? '#4ea8de' : '#ff75a0';
        ctx.stroke();
        ctx.font = 'bold 76px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(state.mic ? `🎙️ ${safeName}` : safeName, 512, 360);
        texture.needsUpdate = true;
      }

      sprite.userData.setData = (newName, newMic, newMessage) => {
        state.name = String(newName || 'เพื่อน');
        state.mic = !!newMic;
        state.message = String(newMessage || '');
        draw();
      };

      draw();
      return sprite;
    }

    function createRemotePlayer(data) {
      const group = bunnyGroup.clone(true);
      group.userData.remote = true;
      group.userData.playerId = data.id;

      const oldSprite = group.getObjectByName('overheadSprite');
      if (oldSprite) {
        group.remove(oldSprite);
        if (oldSprite.material) oldSprite.material.dispose();
      }

      const sprite = createRemoteOverhead(data.name, !!data.mic, data.chat || '');
      group.add(sprite);
      group.position.set(
        Number(data.x) || 0,
        Number(data.y) || 0,
        Number(data.z) || 0
      );
      group.rotation.y = Number(data.rotation) || 0;
      scene.add(group);

      remotePlayers.set(data.id, {
        group,
        data,
        lastSeen: performance.now()
      });

      return group;
    }

    function updateRemotePlayer(data) {
      if (!data || data.id === myPlayerId) return;

      let entry = remotePlayers.get(data.id);
      if (!entry) {
        entry = {
          group: createRemotePlayer(data),
          data,
          lastSeen: performance.now()
        };
      }

      entry.data = data;
      entry.lastSeen = performance.now();

      const target = new THREE.Vector3(
        Number(data.x) || 0,
        Number(data.y) || 0,
        Number(data.z) || 0
      );

      // ทำให้การเคลื่อนที่ของเพื่อนนุ่มขึ้น ไม่กระตุก
      entry.group.position.lerp(target, 0.35);
      entry.group.rotation.y = Number(data.rotation) || 0;

      const sprite = entry.group.getObjectByName('remoteOverheadSprite');
      if (sprite && sprite.userData.setData) {
        const key = `${data.name || ''}|${!!data.mic}|${data.chat || ''}`;
        if (sprite.userData.lastKey !== key) {
          sprite.userData.lastKey = key;
          sprite.userData.setData(data.name, data.mic, data.chat || '');
        }
      }
    }

    function removeRemotePlayer(id) {
      const entry = remotePlayers.get(id);
      if (!entry) return;

      // remote player ถูก clone จาก bunnyGroup ของเรา จึงไม่ dispose geometry/material ที่ใช้ร่วมกัน
      scene.remove(entry.group);
      remotePlayers.delete(id);
    }

    function startMultiplayer() {
      firebaseAuth.signInAnonymously().then(async result => {
        myPlayerId = result.user.uid;

        // จองชื่อเริ่มต้นก่อนประกาศตัวเองออนไลน์
        const initialName = cleanPlayerName(nameInput.value || 'Bunny') || 'Bunny';
        let reservedInitial = await reservePlayerName(initialName, myPlayerId);
        if (!reservedInitial.ok) {
          let fallback = `Bunny${Math.floor(Math.random() * 9999)}`;
          reservedInitial = await reservePlayerName(fallback, myPlayerId);
          if (!reservedInitial.ok) throw new Error('ไม่สามารถจองชื่อผู้เล่นได้');
        }

        currentPlayerName = reservedInitial.name;
        nameInput.value = currentPlayerName;
        firebaseReady = true;
        renderOverheadUI();

        const myRef = playersRef.child(myPlayerId);
        myRef.onDisconnect().remove();
        const myNameRegistryRef = nameRegistryRef.child(normalizePlayerName(currentPlayerName));
        myNameRegistryRef.onDisconnect().remove();

        playersRef.on('value', snapshot => {
          const data = snapshot.val() || {};
          const seen = new Set();

          Object.entries(data).forEach(([id, player]) => {
            if (!player || id === myPlayerId) return;
            seen.add(id);
            updateRemotePlayer({ ...player, id });
          });

          [...remotePlayers.keys()].forEach(id => {
            if (!seen.has(id)) removeRemotePlayer(id);
          });
        }, error => {
          console.error('Firebase multiplayer read error:', error);
          setMultiplayerStatus('Firebase: อ่านข้อมูลเพื่อนไม่ได้', '#ff75a0');
        });

        // ส่งตำแหน่งถี่พอให้เพื่อนเห็นการเคลื่อนไหวลื่น แต่ไม่ยิงฐานข้อมูลหนักเกินไป
        setInterval(publishMyPlayer, 120);
        publishMyPlayer();

        // กันตัวละครค้าง หากเครื่องเพื่อนปิด/หลุดโดย Firebase ยังไม่ทันแจ้ง child_removed
        setInterval(() => {
          const now = performance.now();
          [...remotePlayers.entries()].forEach(([id, entry]) => {
            if (now - entry.lastSeen > 5000) removeRemotePlayer(id);
          });
        }, 2000);
        setMultiplayerStatus('ออนไลน์ • เห็นเพื่อนแล้ว', '#4ea8de');
      }).catch(error => {
        console.error('Firebase anonymous auth error:', error);
        setMultiplayerStatus('Firebase เชื่อมต่อไม่ได้', '#ff75a0');
      });
    }

    function getWrappedLines(ctx, text, maxWidth) {
      const chars = text.split('');
      let lines = [];
      let currentLine = '';
      for (let i = 0; i < chars.length; i++) {
        let testLine = currentLine + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          lines.push(currentLine); currentLine = chars[i];
        } else { currentLine = testLine; }
      }
      if (currentLine) lines.push(currentLine);
      return lines;
    }

    function createSignBoard(config, index) {

      const canvas = document.createElement('canvas');

    function applyFirebaseSignData(index, data) {
      const sign = signs[index];
      if (!sign) return;

      sign.ownerId = data && data.ownerId ? String(data.ownerId) : null;
      sign.ownerName = data && data.ownerName ? String(data.ownerName) : '';
      sign.message = data && data.message ? String(data.message) : '';
      renderSignText(sign);
    }

        updatedAt: firebase.database.ServerValue.TIMESTAMP
      };

      try {
        await signsRef.child(String(sign.index)).set(payload);
        return true;
      } catch (error) {
        console.error('Firebase check-in write error:', error);

        return false;
      }
    }

    function renderSignText(sign) {
      const ctx = sign.ctx;
      ctx.clearRect(0, 0, 2200, 1400);
      
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(0, 0, 2200, 1400);
      ctx.lineWidth = 28; 
      ctx.strokeStyle = '#ffffff'; 
      ctx.strokeRect(16, 16, 2168, 1368);

      ctx.font = 'bold 84px "Segoe UI", sans-serif'; 
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`SIGN #${String(sign.index + 1).padStart(2, '0')}`, 70, 75);

      if (sign.ownerId) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.beginPath(); 
        if (ctx.roundRect) ctx.roundRect(680, 50, 840, 130, 60); else ctx.fillRect(680, 50, 840, 130);
        ctx.fill(); 
        ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        
        ctx.font = 'bold 88px "Segoe UI", sans-serif'; 
        ctx.fillStyle = '#ffffff'; 
        ctx.textAlign = 'center';
        ctx.fillText(sign.ownerName, 1100, 115);

        ctx.font = 'bold 92px "Segoe UI", sans-serif'; 
        ctx.fillStyle = '#ffffff'; 
        ctx.textAlign = 'left';
        const lines = getWrappedLines(ctx, sign.message, 1960);
        lines.forEach((lineText, idx) => ctx.fillText(lineText, 120, 360 + (idx * 128)));
      } else {
        ctx.font = '900 152px "Segoe UI", sans-serif'; 
        ctx.fillStyle = '#ffffff'; 
        ctx.textAlign = 'center';
        ctx.fillText(`[ ป้ายว่าง #${sign.index + 1} ]`, 1100, 620);
        
        ctx.font = 'bold 82px "Segoe UI", sans-serif'; 
        ctx.fillStyle = '#eeeeee';
        ctx.fillText('เดินเข้ามาใกล้ๆ เพื่อเช็คอินที่นี่', 1100, 830);
      }
      sign.texture.needsUpdate = true;
    }

    signPositions.forEach((pos, idx) => createSignBoard(pos, idx));

    // เริ่มฟังข้อมูลป้ายหลังจากสร้างป้ายครบแล้ว
    startSharedSignsListener();

    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    const btnMic = document.getElementById('btn-mic');
    const chatHistory = document.getElementById('chat-history');

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    function addMessageToHistory(author, message) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      msgDiv.innerHTML = `<span class="author">${escapeHTML(author)}:</span> ${escapeHTML(message)} <span class="time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function sendChatMessage() {
      const msg = chatInput.value.trim();
      if (msg !== "") {

        renderOverheadUI();
        publishMyPlayer();
        if (chatMessageTimeout) clearTimeout(chatMessageTimeout);
        chatMessageTimeout = setTimeout(() => { currentChatMessage = ""; renderOverheadUI(); publishMyPlayer(); }, 5000);
        chatInput.value = "";
      }
    }

    btnSend.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });
    btnMic.addEventListener('click', () => { isMicActive = !isMicActive; btnMic.classList.toggle('active', isMicActive); renderOverheadUI(); publishMyPlayer(); });

    const checkinBtn = document.getElementById('checkin-prompt');
    const cancelCheckinBtn = document.getElementById('cancel-checkin-btn');
    const checkinStatusText = document.getElementById('checkin-status');
    const zoneStatusText = document.getElementById('zone-status');
    const warpNotice = document.getElementById('warp-notice');
    let nearbySign = null;

    async function cancelMyCheckin() {
      if (!firebaseReady || !myPlayerId) {
        alert('กำลังเชื่อมต่อ Firebase กรุณารอสักครู่แล้วลองใหม่');
        return;
      }

      if (playerCheckedInSignIndex === null) {
        alert('ตอนนี้คุณยังไม่ได้เช็คอินป้ายไหน');

      }

      const sign = signs[playerCheckedInSignIndex];
      if (!sign) return;

      // ลบได้เฉพาะป้ายที่เป็นของเราเท่านั้น
      if (!sign.ownerId || String(sign.ownerId) !== String(myPlayerId)) {
        alert('ไม่สามารถยกเลิกเช็คอินนี้ได้ เพราะป้ายนี้ไม่ใช่ของคุณ');
        return;
      }

      const ok = confirm(`ต้องการยกเลิกเช็คอินที่ป้าย #${sign.index + 1} ใช่ไหม?\n\nข้อความ: ${sign.message || '-'}\n\nหลังยกเลิก เพื่อนจะเห็นว่าป้ายนี้ว่างทันที`);
      if (!ok) return;

      try {
        await signsRef.child(String(sign.index)).remove();
        // listener จะอัปเดตป้ายและสถานะให้ทุกเครื่องเอง
      } catch (error) {
        console.error('Firebase check-in cancel error:', error);

    }

    cancelCheckinBtn.addEventListener('click', async (e) => {
      e.preventDefault();

    checkinBtn.addEventListener('pointerdown', async (e) => {
      e.preventDefault();
      if (!nearbySign) return;

      if (!firebaseReady || !myPlayerId) {
        alert('กำลังเชื่อมต่อ Firebase กรุณารอสักครู่แล้วลองใหม่');
        return;
      }

      const isMine = nearbySign.ownerId && String(nearbySign.ownerId) === String(myPlayerId);

      if (nearbySign.ownerId !== null && !isMine) {
        alert(`❌ ป้ายนี้ถูกเช็คอินแล้วโดย "${nearbySign.ownerName || 'ผู้เล่น'}"`);
        return;
      }

      if (nearbySign.ownerId === null && playerCheckedInSignIndex !== null) {
        alert(`⚠️ คุณได้เช็คอินไว้ที่ "ป้าย #${playerCheckedInSignIndex + 1}" แล้ว`);
        return;
      }

      const currentMsg = nearbySign.message || 'ความรู้สึกของฉัน...';
      let userText = prompt(`พิมพ์ข้อความบนป้าย #${nearbySign.index + 1}:`, currentMsg);

      if (userText === null || userText.trim() === '') return;

      const trimmedText = userText.trim();
      const tempCtx = nearbySign.ctx;
      tempCtx.font = '92px "Segoe UI", sans-serif';
      const calculatedLines = getWrappedLines(tempCtx, trimmedText, 1960);

      if (calculatedLines.length > 7) {
        alert(`❌ ข้อความยาวเกินพื้นที่ป้าย (${calculatedLines.length} บรรทัด)\nกรุณาย่อข้อความให้ไม่เกิน 7 บรรทัด`);
        return;
      }

      const saved = await saveCheckinToFirebase(nearbySign, trimmedText);
      if (!saved) return;

      // Listener จาก Firebase จะอัปเดตป้ายให้เองทั้งเครื่องเราและเพื่อน
      alert('✅ ส่งข้อความและเช็คอินขึ้น Firebase สำเร็จ!\nเพื่อนจะเห็นป้ายนี้ทันที');
    });

    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    let joyInputX = 0, joyInputY = 0, joystickActive = false;

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickBase.getBoundingClientRect();
      let deltaX = clientX - (rect.left + rect.width / 2);
      let deltaY = clientY - (rect.top + rect.height / 2);
      let dist = Math.hypot(deltaX, deltaY);
      if (dist > 34) { deltaX = (deltaX / dist) * 34; deltaY = (deltaY / dist) * 34; }
      joystickKnob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
      joyInputX = deltaX / 34; joyInputY = deltaY / 34;
    }
    // =========================================================
    // UNIFIED MULTI-TOUCH CONTROL
    // มือถือ/แท็บเล็ต: นิ้วซ้าย = จอย, นิ้วขวา = กล้อง
    // PC/Mac: เมาส์ซ้ายลากจอย/กล้องตามพื้นที่
    //
    // ใช้ Pointer Events + pointerId เดียวกันทุกอุปกรณ์
    // จึงไม่แย่งนิ้วกันและรองรับ 2 นิ้วพร้อมกันได้
    // =========================================================
    let joystickPointerId = null;
    let cameraPointerId = null;
    let isDraggingCam = false;
    let prevCamX = 0, prevCamY = 0;
    let cameraYaw = 0, cameraPitch = 0.35;

    function stopCameraDrag() {
      isDraggingCam = false;
      cameraPointerId = null;
    }

    function resetJoystick() {
      joystickActive = false;
      joystickPointerId = null;
      joyInputX = 0;
      joyInputY = 0;
      joystickKnob.style.transform = 'translate(-50%, -50%)';
    }

    function isJoystickTarget(target) {
      return !!(target && target.closest && target.closest('#joystick-base'));
    }

    function isBlockedUITarget(target) {
      if (!target) return false;
      return !!(target.closest && target.closest('#ui-layer'));
    }

    function beginJoystickPointer(e) {
      if (joystickPointerId !== null) return false;
      if (e.pointerType === 'mouse' && e.button !== 0) return false;

      joystickPointerId = e.pointerId;
      joystickActive = true;
      handleJoystickMove(e.clientX, e.clientY);

      try { joystickBase.setPointerCapture(e.pointerId); } catch (_) {}
      return true;
    }

    function beginCameraPointer(e) {
      if (cameraPointerId !== null) return false;
      if (isBlockedUITarget(e.target)) return false;
      if (e.pointerType === 'mouse' && e.button !== 0) return false;
      if (e.clientX < window.innerWidth / 2) return false;

      cameraPointerId = e.pointerId;
      isDraggingCam = true;
      prevCamX = e.clientX;
      prevCamY = e.clientY;
      return true;
    }

    // จอย: จับ pointer ของมันเอง
    joystickBase.addEventListener('pointerdown', (e) => {
      if (!beginJoystickPointer(e)) return;
      e.preventDefault();
      e.stopPropagation();
    }, { passive: false });

    joystickBase.addEventListener('pointermove', (e) => {
      if (e.pointerId !== joystickPointerId) return;
      e.preventDefault();
      handleJoystickMove(e.clientX, e.clientY);
    }, { passive: false });

    joystickBase.addEventListener('pointerup', (e) => {
      if (e.pointerId === joystickPointerId) resetJoystick();
    }, { passive: true });

    joystickBase.addEventListener('pointercancel', (e) => {
      if (e.pointerId === joystickPointerId) resetJoystick();
    }, { passive: true });

    joystickBase.addEventListener('lostpointercapture', (e) => {
      if (e.pointerId === joystickPointerId) resetJoystick();
    }, { passive: true });

    // กล้อง: รับอีก pointer ได้พร้อมกับจอย
    window.addEventListener('pointerdown', (e) => {
      if (e.pointerId === joystickPointerId) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (!beginCameraPointer(e)) return;
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      if (!isDraggingCam || e.pointerId !== cameraPointerId) return;

      const dx = e.clientX - prevCamX;
      const dy = e.clientY - prevCamY;

      // ป้องกัน pointer กระโดดเมื่อ browser/OS ส่งตำแหน่งผิดปกติ
      if (Math.abs(dx) <= 120 && Math.abs(dy) <= 120) {
        cameraYaw -= dx * 0.006;
        cameraPitch = Math.max(
          -Math.PI / 2 + 0.01,
          Math.min(Math.PI / 2 - 0.01, cameraPitch + dy * 0.005)
        );
      }

      prevCamX = e.clientX;
      prevCamY = e.clientY;
      e.preventDefault();
    }, { passive: false });

    function releasePointer(e) {
      if (e.pointerId === joystickPointerId) resetJoystick();
      if (e.pointerId === cameraPointerId) stopCameraDrag();
    }

    window.addEventListener('pointerup', releasePointer, { passive: true });
    window.addEventListener('pointercancel', releasePointer, { passive: true });

    // ป้องกัน browser scroll/pinch เฉพาะพื้นที่เกม
    document.documentElement.style.touchAction = 'none';
    document.body.style.touchAction = 'none';

    const gameCanvas = document.querySelector('canvas');
    if (gameCanvas) {
      gameCanvas.style.touchAction = 'none';
      gameCanvas.style.userSelect = 'none';
      gameCanvas.style.webkitUserSelect = 'none';
      gameCanvas.style.webkitTouchCallout = 'none';
    }

    let velocityY = 0, gravity = 0.018, isGrounded = true;
    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', e => {
      if (document.activeElement === nameInput || document.activeElement === chatInput) return;
      if (['KeyW', 'ArrowUp'].includes(e.code)) keys.w = true;
      if (['KeyS', 'ArrowDown'].includes(e.code)) keys.s = true;
      if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.a = true;
      if (['KeyD', 'ArrowRight'].includes(e.code)) keys.d = true;
      if (e.code === 'Space') jump();
    });
    window.addEventListener('keyup', e => {
      if (['KeyW', 'ArrowUp'].includes(e.code)) keys.w = false;
      if (['KeyS', 'ArrowDown'].includes(e.code)) keys.s = false;
      if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.a = false;
      if (['KeyD', 'ArrowRight'].includes(e.code)) keys.d = false;
    });

    const jumpButton = document.getElementById('btn-jump');
    jumpButton.style.touchAction = 'manipulation';
    jumpButton.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      jump();
    }, { passive: false });
    function jump() { if (isGrounded) { velocityY = 0.48; isGrounded = false; } }

    const elevatorPrompt = document.getElementById('elevator-prompt');
    let elevatorState = 'ground', elevatorY = ELEVATOR_GROUND_Y, playerOnElevator = false;

    function isPlayerNearElevator() {
      return Math.hypot(bunnyGroup.position.x - ELEVATOR_X, bunnyGroup.position.z - ELEVATOR_Z) < 4.2 && Math.abs(bunnyGroup.position.y - elevatorY) < 5;
    }

    function useElevator() {
      if (!isPlayerNearElevator()) return;
      if (elevatorState === 'ground') { elevatorState = 'goingUp'; playerOnElevator = true; }
      else if (elevatorState === 'sky') { elevatorState = 'goingDown'; playerOnElevator = true; }
    }
    elevatorPrompt.addEventListener('pointerdown', (e) => { e.preventDefault(); useElevator(); });
    window.addEventListener('keydown', (e) => { if (e.code === 'KeyE') useElevator(); });

    let timeAcc = 0;
    function update() {
      timeAcc += 0.03;

      portals.forEach(portal => {
        portal.coreMesh.rotation.y += 0.01;
        portal.outerRing.rotation.x += 0.02;
        portal.outerRing.rotation.y += 0.015;
        portal.innerRing.rotation.y -= 0.025;
        portal.innerRing.rotation.z += 0.018;
      });

      centerTitleGroup.position.y = 18 + Math.sin(timeAcc) * 0.6;
      centerTitleGroup.rotation.y += 0.005;
      starField.rotation.y += 0.0001;

      // --- [อัปเดต] สุ่มเกิดดาวตกถี่ขึ้นและดูสมจริง ---
      if (Math.random() < 0.04) {
        const freeStar = shootingStars.find(s => !s.active);
        if (freeStar) spawnShootingStar(freeStar);
      }
      shootingStars.forEach(star => {
        if (star.active) {
          star.mesh.position.x -= star.speed * 2.5;
          star.mesh.position.y -= star.speed * 1.8;
          star.mesh.position.z -= star.speed * 2.5;
          star.life -= 0.02;
          star.mesh.material.opacity = Math.max(0, star.life);
          if (star.life <= 0) star.active = false;
        }
      });

      let inputForward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0) - joyInputY;
      let inputRight = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joyInputX;
      let inputLen = Math.hypot(inputForward, inputRight);

      const elevatorMoving = elevatorState === 'goingUp' || elevatorState === 'goingDown';
      if (!elevatorMoving && !playerOnElevator && inputLen > 0.05) {
        const speed = 0.38 * Math.min(1, inputLen);
        const moveX = ((inputForward / inputLen) * -Math.sin(cameraYaw)) + ((inputRight / inputLen) * Math.cos(cameraYaw));
        const moveZ = ((inputForward / inputLen) * -Math.cos(cameraYaw)) + ((inputRight / inputLen) * -Math.sin(cameraYaw));
        bunnyGroup.position.x += moveX * speed;
        bunnyGroup.position.z += moveZ * speed;
        bunnyGroup.rotation.y = Math.atan2(moveX, moveZ);
      }

      if (elevatorState === 'goingUp') {
        elevatorY = Math.min(ELEVATOR_TOP_Y, elevatorY + ELEVATOR_SPEED);
        if (elevatorY >= ELEVATOR_TOP_Y) { elevatorY = ELEVATOR_TOP_Y; elevatorState = 'sky'; playerOnElevator = true; zoneStatusText.innerText = 'พื้นกระจกชั้นบน (65ม.)'; }
      } else if (elevatorState === 'goingDown') {
        elevatorY = Math.max(ELEVATOR_GROUND_Y, elevatorY - ELEVATOR_SPEED);
        if (elevatorY <= ELEVATOR_GROUND_Y) { elevatorY = ELEVATOR_GROUND_Y; elevatorState = 'ground'; playerOnElevator = true; zoneStatusText.innerText = 'ห้องหลัก'; }
      }

      elevatorGroup.position.y = elevatorY;
      const onSkyLevel = elevatorY > 5 && (bunnyGroup.position.y > 5);

      if (playerOnElevator) {
        if (elevatorMoving || inputLen <= 0.05) {
          bunnyGroup.position.set(ELEVATOR_X, elevatorY, ELEVATOR_Z);
          velocityY = 0; isGrounded = true;
        } else {
          playerOnElevator = false;
          bunnyGroup.position.x += Math.cos(cameraYaw) * 2.0;
          bunnyGroup.position.z += -Math.sin(cameraYaw) * 2.0;
        }
      } else {
        bunnyGroup.position.y += velocityY;
        if (!isGrounded) velocityY -= gravity;
        let floorY = (elevatorState === 'sky') ? ELEVATOR_TOP_Y : 0;
        if (bunnyGroup.position.y <= floorY) { bunnyGroup.position.y = floorY; velocityY = 0; isGrounded = true; }
      }

      if (inSmallRoom) {
        bunnyGroup.position.x = Math.max(SMALL_ROOM_OFFSET_X - SMALL_BOUNDARY, Math.min(SMALL_ROOM_OFFSET_X + SMALL_BOUNDARY, bunnyGroup.position.x));
        bunnyGroup.position.z = Math.max(-SMALL_BOUNDARY, Math.min(SMALL_BOUNDARY, bunnyGroup.position.z));
      } else if (onSkyLevel) {
        let skyDist = Math.hypot(bunnyGroup.position.x, bunnyGroup.position.z);
        let maxSkyWalk = GLASS_DECK_RADIUS - 2;
        if (skyDist > maxSkyWalk) {
          let angle = Math.atan2(bunnyGroup.position.z, bunnyGroup.position.x);
          bunnyGroup.position.x = Math.cos(angle) * maxSkyWalk;
          bunnyGroup.position.z = Math.sin(angle) * maxSkyWalk;
        }
      } else {
        bunnyGroup.position.x = Math.max(-BOUNDARY, Math.min(BOUNDARY, bunnyGroup.position.x));
        bunnyGroup.position.z = Math.max(-BOUNDARY, Math.min(BOUNDARY, bunnyGroup.position.z));
      }

      let nearAnyPortal = false;
      if (!onSkyLevel) {
        for (let portal of portals) {
          if (bunnyGroup.position.distanceTo(portal.pos) < 4.5) {
            nearAnyPortal = true;
            if (!isWarping && exitedPortalYet) {
              isWarping = true; 
              exitedPortalYet = false;
              
              if (portal.gameId) {
                startGame(portal.gameId);
                setTimeout(() => { isWarping = false; }, 800);
              } else {
                warpNotice.innerText = `🔮 กำลังวาร์ปไปยัง: ${portal.label}`; 
                warpNotice.style.opacity = '1';
                setTimeout(() => {
                  bunnyGroup.position.copy(portal.targetPos);
                  inSmallRoom = (portal.targetPos.x > 300);
                  zoneStatusText.innerText = inSmallRoom ? "ห้องเกมลับ" : "ห้องหลัก";
                }, 300);
                setTimeout(() => { warpNotice.style.opacity = '0'; isWarping = false; }, 1200);
              }
            }
            break;
          }
        }
      }
      if (!nearAnyPortal && portals.every(p => bunnyGroup.position.distanceTo(p.pos) >= 6)) exitedPortalYet = true;

      nearbySign = null;
      for (let sign of signs) {
        if (bunnyGroup.position.distanceTo(sign.position) < 20) { nearbySign = sign; break; }
      }

      if (nearbySign) {
        checkinBtn.style.display = 'flex';
        const mine = nearbySign.ownerId && myPlayerId && String(nearbySign.ownerId) === String(myPlayerId);
        checkinBtn.innerText = mine ? `✏️ แก้ไขป้าย #${nearbySign.index + 1}` : (nearbySign.ownerId !== null ? `🔒 ป้าย #${nearbySign.index + 1} (มีเจ้าของ)` : `📝 เช็คอินป้าย #${nearbySign.index + 1}`);
      } else {
        checkinBtn.style.display = 'none';
      }

      if (isPlayerNearElevator() && !elevatorMoving) {
        elevatorPrompt.style.display = 'flex';
        if (elevatorState === 'ground') {
          elevatorPrompt.className = 'elevator-prompt';
          elevatorPrompt.innerText = '🛗';
        } else {
          elevatorPrompt.className = 'elevator-prompt sky';
          elevatorPrompt.innerText = '⬇️';
        }
      } else if (!elevatorMoving) {
        elevatorPrompt.style.display = 'none';
      }

      let camDist = 16;
      let targetCamX = bunnyGroup.position.x + camDist * Math.sin(cameraYaw) * Math.cos(cameraPitch);
      let targetCamY = bunnyGroup.position.y + camDist * Math.sin(cameraPitch) + 2;
      let targetCamZ = bunnyGroup.position.z + camDist * Math.cos(cameraYaw) * Math.cos(cameraPitch);

      let minCamHeight = bunnyGroup.position.y + 0.2;
      if (targetCamY < minCamHeight) targetCamY = minCamHeight;

      camera.position.set(targetCamX, targetCamY, targetCamZ);
      camera.lookAt(bunnyGroup.position.x, bunnyGroup.position.y + 1.6, bunnyGroup.position.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
    animate();

    function resizeRenderer() {
      const vv = window.visualViewport;
      const width = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
      const height = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }

    window.addEventListener('resize', resizeRenderer, { passive: true });
    window.addEventListener('orientationchange', () => setTimeout(resizeRenderer, 100), { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeRenderer, { passive: true });
    }
    resizeRenderer();
  </script>

<!-- AUTO DEVICE FULLSCREEN / PWA -->
<script>
(function () {
  const doc = document;
  const root = document.documentElement;
  const body = document.body;
  const btn = document.getElementById('fullscreenBtn');

  const ua = navigator.userAgent || '';
  const platform = navigator.platform || '';

  const isIOS =
    /iPad|iPhone|iPod/i.test(ua) ||
    (platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const isAndroid = /Android/i.test(ua);
  const isMobile = isIOS || isAndroid || /Mobile|Tablet/i.test(ua);

  function isStandalone() {
    return !!(
      window.matchMedia &&
      window.matchMedia('(display-mode: standalone)').matches
    ) || window.navigator.standalone === true;
  }

  function getFullscreenElement() {
    return doc.fullscreenElement ||
           doc.webkitFullscreenElement ||
           doc.msFullscreenElement ||
           null;
  }

  function isFullscreen() {
    return !!getFullscreenElement() || isStandalone();
  }

  function updateFullscreenButton() {
    if (!btn) return;

    if (isStandalone()) {
      btn.textContent = '⛶ เต็มจอ PWA';
    } else if (getFullscreenElement()) {
      btn.textContent = '⛶ ออกจากเต็มจอ';
    } else {
      btn.textContent = '⛶ เต็มจอ';
    }
  }

  async function enterFullscreen() {
    // iOS Safari ในแท็บปกติไม่อนุญาต Fullscreen API สำหรับหน้าเว็บทั่วไป
    // หากติดตั้งเป็น PWA จะใช้ standalone และเต็มจอได้
    if (isIOS && !isStandalone()) {
      if (btn) btn.textContent = '📱 เพิ่มไปหน้าจอหลัก';
      setTimeout(updateFullscreenButton, 1800);
      return false;
    }

    const target = root || body;
    const fn = target.requestFullscreen ||
               target.webkitRequestFullscreen ||
               target.msRequestFullscreen;

    if (typeof fn !== 'function') {
      if (btn) {
        btn.textContent = isMobile
          ? '📱 ใช้โหมดเต็มจอของเครื่อง'
          : '⚠️ เต็มจอไม่รองรับ';
      }
      setTimeout(updateFullscreenButton, 2200);
      return false;
    }

    try {
      const result = fn.call(target);
      if (result && typeof result.then === 'function') await result;
      return true;
    } catch (err) {
      console.warn('Fullscreen request failed:', err);
      return false;
    }
  }

  async function exitFullscreen() {
    const fn = doc.exitFullscreen ||
               doc.webkitExitFullscreen ||
               doc.msExitFullscreen;

    if (typeof fn !== 'function') return false;

    try {
      const result = fn.call(doc);
      if (result && typeof result.then === 'function') await result;
      return true;
    } catch (err) {
      console.warn('Exit fullscreen failed:', err);
      return false;
    }
  }

  async function toggleFullscreen() {
    if (getFullscreenElement()) {
      await exitFullscreen();
    } else {
      await enterFullscreen();
    }

    setTimeout(() => {
      if (typeof resizeRenderer === 'function') resizeRenderer();
      updateFullscreenButton();
    }, 100);
  }

  window.toggleFullscreen = toggleFullscreen;

  if (btn) {
    btn.style.pointerEvents = 'auto';
    btn.style.touchAction = 'manipulation';

    btn.addEventListener('pointerup', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleFullscreen();
    }, { passive: false });
  }

  ['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange', 'orientationchange']
    .forEach((eventName) => {
      doc.addEventListener(eventName, () => {
        setTimeout(() => {
          if (typeof resizeRenderer === 'function') resizeRenderer();
          updateFullscreenButton();
        }, 80);
      }, false);
    });

  window.deviceInfo = {
    isIOS,
    isAndroid,
    isMobile,
    isStandalone: isStandalone()
  };

  updateFullscreenButton();
})();
</script>

<script id="high-quality-textures">
(function applyHighQualityTextures() {
    if (typeof THREE === "undefined") return;

    function sharpenTexture(texture) {
        if (!texture) return;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.anisotropy = Math.min(
            (typeof renderer !== "undefined" && renderer.capabilities)
                ? renderer.capabilities.getMaxAnisotropy()
                : 8,
            16
        );
        texture.needsUpdate = true;
    }

    function scan() {
        if (typeof scene === "undefined" || !scene.traverse) return;
        scene.traverse(function(obj) {
            if (!obj) return;

            if (obj.material) {
                const materials = Array.isArray(obj.material)
                    ? obj.material
                    : [obj.material];

                materials.forEach(function(mat) {
                    if (!mat) return;
                    [
                        "map", "alphaMap", "normalMap", "roughnessMap",
                        "metalnessMap", "emissiveMap", "aoMap"
                    ].forEach(function(key) {
                        if (mat[key]) sharpenTexture(mat[key]);
                    });
                });
            }
        });
    }

    // Run repeatedly because some game assets are created after startup.
    scan();
    setTimeout(scan, 500);
    setTimeout(scan, 1500);
    setTimeout(scan, 3000);
})();
</script>
